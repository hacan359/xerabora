<!doctype html>
<html lang="en" data-theme="plain" data-mode="idle">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>xerabora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ==== 00-tokens.css ==== */
/* ---- Tokens -------------------------------------------------------------
   Colours, radii, fonts, easing. [data-theme] on <html> swaps the whole
   set; [data-mode] shifts the accent and the washes. The palette is the
   project site's. */
:root {
  color-scheme: dark;

  --bg: #0A1020;
  --bg-raised: #0F1729;
  --bg-sunken: #060B17;
  --bg-hover: #16213A;
  --line: #1E2A45;
  --line-strong: #2C3C62;
  --ink: #E8ECF5;
  --ink-soft: #AEB8D0;
  --ink-mute: #7C88A6;
  --white: #FFFFFF;

  --blue: #3D8BFF;
  --blue-bright: #34D0FF;
  --gold: #E0A526;
  --ok: #5FD38A;
  --warn: #F2B96B;
  --danger: #FF6B6B;

  /* Accent: overridden per mode below. */
  --accent: var(--blue);
  --accent-ink: #06101F;
  --accent-soft: rgba(61, 139, 255, 0.14);
  --accent-line: rgba(61, 139, 255, 0.5);
  --accent-glow: rgba(61, 139, 255, 0.35);
  --bar: linear-gradient(90deg, #2F6FD8, var(--blue-bright));

  /* Opacity of the two washes behind the page (10-base.css). */
  --wash-blue: 0.55;
  --wash-gold: 0;

  --radius: 12px;
  --radius-sm: 9px;
  --radius-xs: 6px;
  --shadow: 0 14px 34px rgba(0, 0, 0, 0.38);

  --font-display: "Chakra Petch", "Trebuchet MS", "Segoe UI", sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", Helvetica, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;

  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --mode-t: 0.7s;
}

:root[data-mode="console"] {
  --accent: var(--gold);
  --accent-soft: rgba(224, 165, 38, 0.15);
  --accent-line: rgba(224, 165, 38, 0.55);
  --accent-glow: rgba(224, 165, 38, 0.4);
  --bar: linear-gradient(90deg, #B37F14, #F3C86B);
  --wash-blue: 0.25;
  --wash-gold: 1;
}

:root[data-mode="follow"] {
  --accent: var(--blue-bright);
  --accent-soft: rgba(52, 208, 255, 0.13);
  --accent-line: rgba(52, 208, 255, 0.5);
  --accent-glow: rgba(52, 208, 255, 0.35);
  --bar: linear-gradient(90deg, #2A8DC8, #7FE6FF);
  --wash-blue: 0.9;
  --wash-gold: 0;
}

/* ==== 10-base.css ==== */
/* ---- Base ---------------------------------------------------------------
   Reset, type, links, the page background, the section label. */
*, *::before, *::after { box-sizing: border-box; }
html, body { max-width: 100%; overflow-x: hidden; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.45 var(--font-body);
  min-height: 100vh;
  min-height: 100dvh;
}

/* The washes: two fixed layers behind the page. Their opacity follows
   --wash-blue and --wash-gold, with a transition. */
body::before, body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  transition: opacity var(--mode-t) var(--ease);
}
body::before {
  background:
    radial-gradient(90% 60% at 12% -10%, rgba(61, 139, 255, 0.22), transparent 60%),
    radial-gradient(60% 45% at 100% 100%, rgba(52, 208, 255, 0.10), transparent 60%);
  opacity: var(--wash-blue);
}
body::after {
  background:
    radial-gradient(80% 55% at 18% -8%, rgba(224, 165, 38, 0.26), transparent 62%),
    radial-gradient(50% 40% at 95% 100%, rgba(224, 165, 38, 0.10), transparent 60%);
  opacity: var(--wash-gold);
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
img { max-width: 100%; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.mono { font-family: var(--font-mono); }
.mute { color: var(--ink-mute); }
.soft { color: var(--ink-soft); }
.ok { color: var(--ok); }
.warn { color: var(--warn); }
.gold { color: var(--gold); }
.acc { color: var(--accent); }
.danger { color: var(--danger); }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.wrap-any { overflow-wrap: anywhere; }

/* Section label: a small display-face caption with a rule after it. */
.eyebrow {
  display: flex; align-items: center; gap: 12px;
  margin: 24px 0 10px;
  font: 600 11px/1 var(--font-display);
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--ink-mute);
}
.eyebrow::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.eyebrow .count { color: var(--ink-soft); letter-spacing: 0.06em; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 999px; border: 2px solid var(--bg); }
::-webkit-scrollbar-track { background: transparent; }

/* ==== 20-layout.css ==== */
/* ---- Layout -------------------------------------------------------------
   Header, status strip, main column, footer. Under 720px the tabs are a
   fixed bar along the bottom. */
.app { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.wrap { width: 100%; max-width: 1180px; margin: 0 auto; padding-left: 20px; padding-right: 20px; }

/* The blur is on a pseudo-element. The header itself has no filter, so
   the fixed tab bar inside it is placed against the viewport. */
header.top { position: sticky; top: 0; z-index: 20; border-bottom: 1px solid var(--line); }
header.top::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: rgba(10, 16, 32, 0.8);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
header.top .wrap { display: flex; align-items: center; gap: 14px; height: 56px; }

.brand {
  display: flex; align-items: baseline; gap: 8px; white-space: nowrap;
  font: 700 19px/1 var(--font-display); letter-spacing: 0.02em; color: var(--white);
}
.brand .r { color: var(--blue); }
.brand .a { color: var(--gold); }
.brand .ver { font: 400 11.5px/1 var(--font-mono); color: var(--ink-mute); }

nav.tabs { display: flex; gap: 2px; margin-left: 10px; }
nav.tabs button {
  font: 600 12.5px/1 var(--font-display); letter-spacing: 0.1em; text-transform: uppercase;
  background: none; border: 0; color: var(--ink-mute);
  padding: 10px 13px; border-radius: var(--radius-sm);
  transition: color 0.15s, background 0.15s;
}
nav.tabs button:hover { color: var(--ink); background: var(--bg-hover); }
nav.tabs button.on { color: var(--accent-ink); background: var(--accent); }

.hdr-right { margin-left: auto; display: flex; align-items: center; gap: 12px; min-width: 0; }
.who { font: 13px var(--font-mono); color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who b { color: var(--white); font-weight: 500; }
.who .pts { color: var(--gold); }
select.lang {
  background: var(--bg-raised); border: 1px solid var(--line); color: var(--ink-soft);
  font: 500 12px var(--font-mono); padding: 5px 6px; border-radius: var(--radius-xs); cursor: pointer;
}
select.lang:hover, select.lang:focus { border-color: var(--accent); color: var(--ink); outline: none; }

/* Status strip: the link light, the mode badge, the link text, the
   live counters. */
.status { border-bottom: 1px solid var(--line); background: rgba(15, 23, 41, 0.6); transition: background var(--mode-t); }
.status .wrap { display: flex; align-items: center; gap: 12px; min-height: 40px; padding-top: 6px; padding-bottom: 6px; }
.dot {
  width: 10px; height: 10px; border-radius: 50%; flex: none;
  background: var(--ink-mute); transition: background 0.3s, box-shadow 0.3s;
}
.dot.on { background: var(--ok); box-shadow: 0 0 0 4px rgba(95, 211, 138, 0.18), 0 0 14px var(--ok); }
:root[data-mode="console"] .dot.on {
  background: var(--gold); box-shadow: 0 0 0 4px rgba(224, 165, 38, 0.2), 0 0 14px var(--gold);
  animation: pulse 2.2s ease-in-out infinite;
}
.status .text { font: 13.5px var(--font-mono); color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
.status .counters { margin-left: auto; font: 12.5px var(--font-mono); color: var(--ink-mute); white-space: nowrap; }
.mode {
  font: 600 10.5px/1 var(--font-display); letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--accent); border: 1px solid var(--accent-line); background: var(--accent-soft);
  padding: 5px 9px; border-radius: 999px; white-space: nowrap;
  transition: color var(--mode-t), border-color var(--mode-t), background var(--mode-t);
}

/* The column is the container the @container rules measure. */
main.wrap { flex: 1; padding-top: 18px; padding-bottom: 32px; container: page / inline-size; }
.tab { animation: fadein 0.22s var(--ease); }

footer { border-top: 1px solid var(--line); }
footer .wrap { display: flex; align-items: center; gap: 10px; height: 52px; }
footer .clock { margin-left: auto; font: 13px var(--font-mono); color: var(--ink-mute); }

@media (max-width: 960px) {
  nav.tabs { margin-left: 2px; }
  nav.tabs button { padding: 9px 8px; font-size: 11.5px; letter-spacing: 0.06em; }
  .who { max-width: 190px; }
  .who .pts { display: none; }
}

@media (max-width: 720px) {
  .wrap { padding-left: 14px; padding-right: 14px; }
  header.top .wrap { height: 52px; gap: 10px; }
  .brand { font-size: 17px; }
  .brand .ver { display: none; }
  .who { font-size: 12px; }
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; margin: 0;
    background: rgba(10, 16, 32, 0.96);
    border-top: 1px solid var(--line);
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  nav.tabs button { flex: 1; padding: 12px 0; font-size: 10.5px; letter-spacing: 0.06em; }
  main.wrap { padding-bottom: 96px; }
  footer { display: none; }
  .status .counters { display: none; }
}

/* ==== 30-components.css ==== */
/* ---- Components ---------------------------------------------------------
   Tiles, progress, rows, chips, cards, the switch, buttons, forms, the
   game head, notes, the toast. */

.panel { background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius); }

/* ---- Stat tiles ---- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 14px; }
.cell { background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px; min-width: 0; }
.cell .k { font: 600 10px/1 var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-mute); }
.cell .v { margin-top: 6px; font: 500 17px/1.3 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--ink); overflow-wrap: anywhere; }
.cell .v small { font-size: 12.5px; color: var(--ink-mute); }

/* ---- Progress bars ---- */
.bar { height: 10px; border-radius: 999px; background: var(--bg-sunken); border: 1px solid var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 999px; background: var(--bar); transition: width 0.3s var(--ease); }
.bar.thin { height: 7px; }
/* Two bars, softcore blue and hardcore gold, in every mode. */
.bars { display: flex; flex-direction: column; gap: 5px; }
.prog { display: flex; align-items: center; gap: 10px; }
.prog .bar { flex: 1; }
.prog .k { width: 74px; flex: none; font: 600 9.5px/1 var(--font-display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-mute); }
.prog .n { width: 64px; flex: none; text-align: right; font: 12px var(--font-mono); color: var(--ink-soft); }
.bar.sc i { background: linear-gradient(90deg, #2F6FD8, #34D0FF); }
.bar.hc i { background: linear-gradient(90deg, #B37F14, #F3C86B); }
.mini { height: 5px; border-radius: 999px; background: var(--bg-sunken); overflow: hidden; margin-top: 7px; }
.mini i { display: block; height: 100%; background: var(--accent); transition: width 0.25s; }

/* ---- Achievement rows ---- */
.row {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 12px; margin-bottom: 6px;
  background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius-sm);
  transition: border-color 0.2s, background 0.2s;
}
.row.done { border-color: rgba(95, 211, 138, 0.35); background: linear-gradient(90deg, rgba(95, 211, 138, 0.09), transparent 45%) var(--bg-raised); }
.row.near { border-color: var(--accent-line); }
.row.na { border-style: dashed; }
.row.na .t, .row.na .d { opacity: 0.7; }
.row.clickable { cursor: pointer; }
.row.clickable:hover { background: var(--bg-hover); border-color: var(--line-strong); }
.row .badge { width: 44px; height: 44px; border-radius: 8px; background: var(--bg-sunken); flex: none; object-fit: cover; }
.row.done .badge { box-shadow: 0 0 0 2px rgba(95, 211, 138, 0.45); }
.row.na .badge, .row.locked .badge { filter: saturate(0.4) brightness(0.75); }
.row .body { flex: 1; min-width: 0; }
.row .t { font-weight: 700; color: var(--white); overflow-wrap: anywhere; }
.row .d { color: var(--ink-soft); font-size: 13.5px; overflow-wrap: anywhere; }
.row .m { flex: none; width: 172px; text-align: right; font: 12.5px/1.5 var(--font-mono); color: var(--ink-mute); }
.row .m .lead { font-size: 13.5px; font-weight: 500; }
.row .m .tag { display: block; }
.row.big { padding: 14px 14px; }
.row.big .badge { width: 60px; height: 60px; border-radius: 10px; }
.row.big .t { font-size: 18px; font-family: var(--font-display); letter-spacing: 0.01em; }
.row.big .d { font-size: 14px; }
.row.big .m { width: 190px; }
.row .m .hide {
  display: inline-block; margin-top: 8px; padding: 5px 9px; border-radius: 999px; cursor: pointer;
  font: 600 10px/1 var(--font-display); letter-spacing: 0.1em; color: var(--ink-mute); border: 1px solid var(--line);
  transition: color 0.15s, border-color 0.15s;
}
.row .m .hide:hover { color: var(--danger); border-color: var(--danger); }
@container page (max-width: 560px) {
  .row { flex-wrap: wrap; }
  .row .m, .row.big .m {
    width: 100%; padding-left: 58px; text-align: left;
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px;
  }
  .row.big .m { padding-left: 74px; }
}

/* ---- Chips and filter rows ---- */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); color: var(--ink-soft); background: var(--bg-raised);
  padding: 6px 12px; border-radius: 999px; cursor: pointer;
  font: 500 12px/1 var(--font-display); letter-spacing: 0.08em; text-transform: uppercase;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
  user-select: none;
}
.chip:hover { color: var(--ink); border-color: var(--line-strong); }
.chip.on { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
.chip .n { color: var(--ink-mute); letter-spacing: 0; font-family: var(--font-mono); }
.chip.on .n { color: var(--accent); }
.chip.static { cursor: default; }
.chip.sm { padding: 4px 9px; font-size: 10px; letter-spacing: 0.06em; }
.eyebrow .chip { text-transform: none; }

/* ---- Library cards ---- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.card {
  background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius);
  overflow: hidden; cursor: pointer;
  transition: transform 0.18s var(--ease), border-color 0.18s, box-shadow 0.18s;
}
.card:hover { transform: translateY(-2px); border-color: var(--accent-line); box-shadow: var(--shadow); }
.card .art { position: relative; height: 118px; display: flex; align-items: center; justify-content: center; background: var(--bg-sunken); overflow: hidden; }
.card .art .blur { position: absolute; inset: -24px; background-size: cover; background-position: center; filter: blur(20px) saturate(1.3); opacity: 0.55; }
.card .art img { position: relative; height: 92px; width: 92px; border-radius: 10px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5); object-fit: cover; }
.card .art .corner { position: absolute; left: 8px; top: 8px; z-index: 1; }
.card .meta { padding: 10px 12px 12px; }
.card .name { font-weight: 700; color: var(--white); height: 2.9em; line-height: 1.45; overflow: hidden; margin-bottom: 8px; }
.card .foot { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; margin-top: 8px; font: 12.5px var(--font-mono); color: var(--ink-soft); }
.card .foot > span:first-child { white-space: nowrap; }
.card .foot .right { margin-left: auto; text-align: right; }
.card .art .corner .award { background: rgba(6, 11, 23, 0.85); }

.award { font: 600 10px/1 var(--font-display); letter-spacing: 0.1em; padding: 4px 7px; border-radius: 999px; border: 1px solid; white-space: nowrap; }
.award.gold { color: var(--gold); border-color: var(--gold); background: rgba(224, 165, 38, 0.12); }
.award.green { color: var(--ok); border-color: var(--ok); background: rgba(95, 211, 138, 0.12); }
.award.blue { color: var(--blue-bright); border-color: var(--blue-bright); background: rgba(52, 208, 255, 0.1); }
@container page (max-width: 560px) {
  .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .card .art { height: 96px; }
  .card .art img { width: 72px; height: 72px; }
  .card .name { font-size: 14px; }
}

/* ---- Switch: a label, a line of text, a toggle ---- */
.switch {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 14px; margin-bottom: 14px; cursor: pointer; user-select: none;
  background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius);
  transition: border-color 0.2s;
}
.switch:hover { border-color: var(--line-strong); }
.switch .k { font: 600 12px/1 var(--font-display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink); white-space: nowrap; }
.switch .d { color: var(--ink-soft); font-size: 13.5px; flex: 1; min-width: 0; }
.switch .tog { width: 40px; height: 22px; border-radius: 999px; background: var(--line-strong); position: relative; flex: none; transition: background 0.2s; }
.switch .tog::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--white); transition: transform 0.2s var(--ease); }
.switch.on .tog { background: var(--ok); }
.switch.on .tog::after { transform: translateX(18px); }
.switch.busy { opacity: 0.5; pointer-events: none; }
@container page (max-width: 560px) {
  .switch { flex-wrap: wrap; }
  .switch .d { flex-basis: 100%; order: 3; }
  .switch .tog { margin-left: auto; }
}

/* ---- Buttons and forms ---- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font: 600 12px/1 var(--font-display); letter-spacing: 0.1em; text-transform: uppercase;
  padding: 11px 16px; border-radius: var(--radius-sm);
  border: 1px solid var(--line-strong); background: var(--bg-raised); color: var(--ink);
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.btn:hover { background: var(--bg-hover); border-color: var(--accent-line); }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); border-color: rgba(255, 107, 107, 0.5); background: transparent; }
.btn.danger:hover { background: var(--danger); color: var(--accent-ink); border-color: var(--danger); }
.btn:disabled { opacity: 0.5; cursor: default; filter: none; }
.btn.sm { padding: 7px 10px; font-size: 10.5px; }

.set { max-width: 520px; }
.set .block { margin-bottom: 26px; }
.set label { display: block; color: var(--ink-mute); font: 600 10.5px/1 var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; margin: 14px 0 6px; }
.set .note { color: var(--ink-soft); font-size: 13.5px; margin-top: 6px; }
.set .links { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 12px; }
.set .links a { font: 600 11px/1 var(--font-display); letter-spacing: 0.12em; color: var(--accent); text-decoration: none; }
.set .links a:hover { color: var(--ink); }
.set .links + .note { margin-top: 14px; }
.set .msg { font: 13px var(--font-mono); margin-top: 10px; min-height: 1.3em; }
.set .btn { margin-top: 12px; }
input.f, select.f {
  width: 100%; background: var(--bg-sunken); border: 1px solid var(--line); color: var(--ink);
  padding: 10px 12px; border-radius: var(--radius-sm); font: 14px var(--font-mono);
}
input.f:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }

/* ---- Game head: cover, title, progress ---- */
.head { display: flex; gap: 18px; align-items: center; margin: 4px 0 16px; min-width: 0; }
.head .cover { width: 96px; height: 96px; border-radius: 14px; background: var(--bg-sunken); border: 1px solid var(--line); flex: none; object-fit: cover; box-shadow: var(--shadow); }
.head .body { flex: 1; min-width: 0; }
.head h1 { font: 700 22px/1.25 var(--font-display); margin: 0 0 8px; color: var(--white); overflow-wrap: anywhere; }
.head .h1-award { display: inline-block; vertical-align: middle; margin-left: 6px; }
.head .sub { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 8px; font: 13px var(--font-mono); color: var(--ink-soft); }
.head .sub .right { margin-left: auto; }
@container page (max-width: 560px) {
  .head { gap: 12px; }
  .head .cover, .disc { width: 72px; height: 72px; }
  .head h1 { font-size: 18px; }
}

/* ---- Placeholders, notes, the error box ---- */
.empty { color: var(--ink-mute); padding: 26px 0; }
.note { color: var(--ink-soft); font-size: 13.5px; }
.banner { padding: 10px 14px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--bg-raised); margin-bottom: 10px; }
.banner.ok { border-color: rgba(95, 211, 138, 0.4); color: var(--ok); }
.banner.warn { border-color: rgba(242, 185, 107, 0.4); color: var(--warn); }
.err { color: var(--danger); font: 13px var(--font-mono); white-space: pre-wrap; padding: 10px 0 14px; }
.hash { font: 12px var(--font-mono); color: var(--ink-mute); margin: -6px 0 14px; overflow-wrap: anywhere; }
.subsets { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 14px; }

/* ---- Unlock toast ---- */
.toast {
  position: fixed; right: 18px; bottom: 18px; z-index: 40;
  display: flex; align-items: center; gap: 14px;
  padding: 14px 18px 14px 14px; border-radius: var(--radius);
  background: var(--bg-raised); border: 1px solid var(--gold);
  box-shadow: 0 0 0 4px rgba(224, 165, 38, 0.15), var(--shadow);
  animation: toastin 0.3s var(--ease);
  max-width: min(420px, calc(100vw - 36px));
}
.toast img { width: 56px; height: 56px; border-radius: 10px; flex: none; }
.toast .k { font: 600 10.5px/1 var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
.toast .t { font-weight: 700; color: var(--white); }
.toast .p { font: 13px var(--font-mono); color: var(--ok); }
@media (max-width: 720px) { .toast { left: 14px; right: 14px; bottom: 84px; max-width: none; } }

.closed { text-align: center; padding: 80px 20px; color: var(--ink-mute); }

/* ==== 40-effects.css ==== */
/* ---- Effects ------------------------------------------------------------
   Keyframes, the power-on sweep, the disc, the follow ring. Everything
   that moves is off under prefers-reduced-motion. */

@keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes toastin { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 4px rgba(224, 165, 38, 0.2), 0 0 14px var(--gold); } 50% { box-shadow: 0 0 0 7px rgba(224, 165, 38, 0.08), 0 0 22px var(--gold); } }
@keyframes ring { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(1.35); opacity: 0; } }
@keyframes sweep {
  0% { background-position: 180% 0; opacity: 0; }
  10% { opacity: 1; }
  100% { background-position: -80% 0; opacity: 0; }
}
@keyframes flash { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }

/* Power-on: a band of light sweeps the page once; JS mounts .poweron
   for 1.3 s when the console connects. */
.poweron { position: fixed; inset: 0; z-index: 60; pointer-events: none; }
.poweron::before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(100deg, transparent 35%, rgba(255, 236, 190, 0.22) 48%, rgba(255, 255, 255, 0.28) 50%, rgba(255, 236, 190, 0.22) 52%, transparent 65%);
  background-size: 260% 100%; mix-blend-mode: screen;
  animation: sweep 1.1s var(--ease) forwards;
}
.poweron::after {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(70% 50% at 50% 40%, rgba(224, 165, 38, 0.18), transparent 70%);
  animation: flash 1.2s ease-out forwards;
}

/* The disc: the cover in .face, which JS rotates; .iris and .grooves
   turn with it. .sheen, .rim and .hole are outside .face and stay put.
   .stall darkens the face and lights the hole red. */
.disc { position: relative; width: 96px; height: 96px; flex: none; border-radius: 50%; box-shadow: var(--shadow), 0 0 24px var(--accent-glow); transition: box-shadow var(--mode-t); }
.disc .face { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; background: var(--bg-sunken); will-change: transform; }
.disc .face img { width: 100%; height: 100%; object-fit: cover; display: block; }
.disc .iris {
  position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(from 0deg, #ff6b6b, #ffd166, #5fd38a, #34d0ff, #7c6bff, #ff6bd6, #ff6b6b);
  opacity: 0.22; mix-blend-mode: screen;
  -webkit-mask: radial-gradient(circle, transparent 26%, #000 29%, #000 68%, transparent 71%);
  mask: radial-gradient(circle, transparent 26%, #000 29%, #000 68%, transparent 71%);
}
.disc .grooves {
  position: absolute; inset: 0; border-radius: 50%;
  background: repeating-radial-gradient(circle, rgba(255, 255, 255, 0.05) 0 1px, transparent 1px 3px);
  opacity: 0.6;
}
.disc .sheen {
  position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
  background: conic-gradient(from 0deg, rgba(255, 255, 255, 0) 0deg, rgba(255, 255, 255, 0.38) 24deg, rgba(255, 255, 255, 0) 58deg, rgba(255, 255, 255, 0) 180deg, rgba(255, 255, 255, 0.22) 206deg, rgba(255, 255, 255, 0) 240deg);
  mix-blend-mode: screen;
}
.disc .rim { position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.28), inset 0 0 0 3px rgba(0, 0, 0, 0.35); }
.disc .hole {
  position: absolute; left: 50%; top: 50%; width: 24%; height: 24%; margin: -12% 0 0 -12%;
  border-radius: 50%; background: var(--bg);
  box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.22), 0 0 0 5px rgba(0, 0, 0, 0.4), inset 0 0 6px rgba(0, 0, 0, 0.8);
}
.disc.stall .face { filter: brightness(0.7) contrast(1.1); }
.disc.stall .hole { box-shadow: 0 0 0 2px var(--danger), 0 0 0 5px rgba(0, 0, 0, 0.4), inset 0 0 6px rgba(0, 0, 0, 0.8); }

/* Following: the cover with a ring that grows and fades on a loop. */
.cover-wrap { position: relative; flex: none; }
.cover-wrap .ring { position: absolute; inset: -2px; border-radius: 16px; border: 2px solid var(--accent); animation: ring 2.4s ease-out infinite; pointer-events: none; }

@media (prefers-reduced-motion: reduce) {
  .poweron, .cover-wrap .ring { display: none; }
  .tab { animation: none; }
  :root[data-mode="console"] .dot.on { animation: none; }
  .bar i, .mini i { transition: none; }
}

</style>

/* ==== 00-i18n.js ==== */
/* ---- Language --------------------------------------------------------- */

/* t() looks a string up in LANG[lang] and falls back to the English
   key. LANG is generated from ui/lang/*.json at build time. {name}
   placeholders are filled after the lookup. */
const LANGS = [['', 'English'], ['pt-BR', 'Português (Brasil)'], ['es', 'Español']];

let lang = '';
try { lang = localStorage.getItem('lang') || ''; } catch (e) { lang = ''; }
/* lang= in the query string or the hash overrides the stored choice
   for this window. */
{
  const q = new URLSearchParams(location.search).get('lang') ||
            new URLSearchParams(location.hash.slice(1)).get('lang');

  if (q !== null && LANGS.some(([code]) => code === q)) lang = q;
}

/* Keys and translations may carry &middot;, &mdash; and &amp;. The
   page renders text nodes, so they become the characters. */
function entities(s) {
  return s.replace(/&middot;/g, '·').replace(/&mdash;/g, '—').replace(/&amp;/g, '&');
}

function t(s, v) {
  const d = LANG[lang];
  let out = entities((d && d[s]) || s);

  if (v) for (const k in v) out = out.split('{' + k + '}').join(String(v[k]));
  return out;
}

/* t() with elements among the values: the string is split on each
   placeholder and returned as an array of strings and nodes. */
function tv(s, v) {
  let parts = [t(s)];

  for (const k in v) {
    const next = [];

    for (const p of parts) {
      if (typeof p !== 'string') { next.push(p); continue; }
      p.split('{' + k + '}').forEach((bit, i) => {
        if (i) next.push(v[k]);
        if (bit) next.push(bit);
      });
    }
    parts = next;
  }
  return parts;
}

/* Stores the choice in this browser and reloads. */
function setLang(code) {
  try { localStorage.setItem('lang', code); } catch (e) { /* private window */ }
  location.reload();
}

/* ==== 01-util.js ==== */
/* ---- Small helpers, shared by every tab -------------------------------- */

const BADGE = 'https://media.retroachievements.org/Badge/';
const MEDIA = 'https://media.retroachievements.org';

/* True when the page was opened from another device. Settings, the
   follow switch and QUIT are then hidden. */
const REMOTE = !['127.0.0.1', 'localhost', '::1', '[::1]'].includes(location.hostname);

const TABS = ['live', 'library', 'game', 'boards', 'settings'];

function hms(s) {
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h + ':' + String(m).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

function pct(a, b) { return b ? Math.round(a * 100 / b) : 0; }

/* rc_client's measured_percent is already 0..100. */
function pctClamp(v) { return Math.max(0, Math.min(100, +v || 0)); }

function ago(sec) {
  if (sec < 60) return t('{n} s', { n: sec });
  if (sec < 3600) return t('{n} min', { n: Math.floor(sec / 60) });
  return t('{h} h {m} min', { h: Math.floor(sec / 3600), m: Math.floor((sec % 3600) / 60) });
}

/* The whole line is one dictionary string. */
function agoText(sec) { return t('{time} ago', { time: ago(sec) }); }

function medianText(s) {
  return Math.floor(s / 3600) + 'h' + String(Math.floor(s % 3600 / 60)).padStart(2, '0');
}

function badgeUrl(a, locked) { return BADGE + a.badge + (locked ? '_lock' : '') + '.png'; }

/* Rank in the progression-path order; untyped rows take 2. */
const TYPE_RANK = { progression: 0, win_condition: 1, missable: 3 };

/* achType() maps rc_client's numeric type or the Web API's string to
   'missable', 'progression', 'win_condition' or ''. */
const TYPE_NAMES = ['', 'missable', 'progression', 'win_condition'];

function achType(a) {
  return typeof a.type === 'number' ? (TYPE_NAMES[a.type] || '')
                                    : (a.type || '').toLowerCase();
}

function onPath(a) {
  const ty = achType(a);
  return ty === 'progression' || ty === 'win_condition';
}

/* Time cost of a set from its medians: beaten is the latest median on
   the intended path, full the latest of all. */
function setEstimates(list, medOf) {
  const meds = list.map(medOf).filter(m => m > 0);
  const path = list.filter(onPath).map(medOf).filter(m => m > 0);

  return { full: meds.length ? Math.max(...meds) : 0,
           beaten: path.length ? Math.max(...path) : 0 };
}

/* UP NEXT: the four locked achievements with the lowest medians. The
   first locked progression or win-condition achievement takes the last
   slot when it is not among them. */
function upNextPick(list, med) {
  const byMed = (x, y) => med(x) - med(y);
  const locked = list.filter(a => a.state === 1 && med(a) > 0);
  const spine = locked.filter(onPath).sort(byMed);
  const next = locked.sort(byMed).slice(0, 4);

  if (spine.length && !next.includes(spine[0])) {
    next[next.length - 1] = spine[0];
    next.sort(byMed);
  }
  return { next, prog: spine.length ? spine[0] : null };
}

/* Locked missables whose median is at or before the latest median
   among the unlocked progression and win-condition achievements. */
function possiblyMissed(list, med) {
  const passed = Math.max(0, ...list.filter(a => a.state === 2 && onPath(a)).map(med));
  const out = new Set();

  for (const a of list)
    if (a.state === 1 && achType(a) === 'missable' && med(a) > 0 && med(a) <= passed)
      out.add(a.id);
  return out;
}

function sortAchievements(list, order) {
  const byAuthor = (a, b) => a.order - b.order;

  if (order === 'median')
    /* Never-unlocked-by-anyone (median 0) goes to the end. */
    return list.sort((a, b) =>
      (a.median > 0 ? a.median : Infinity) - (b.median > 0 ? b.median : Infinity) || byAuthor(a, b));
  if (order === 'type')
    return list.sort((a, b) =>
      (TYPE_RANK[achType(a)] ?? 2) - (TYPE_RANK[achType(b)] ?? 2) || byAuthor(a, b));
  return list.sort(byAuthor);
}

/* ==== 02-store.js ==== */
/* ---- The store: signals the components read ---------------------------- */

const { h, render, Fragment } = require('preact');
const { useState, useEffect, useRef, useMemo } = require('preact/hooks');
const { signal, computed, effect, batch } = require('@preact/signals');
const html = require('htm').bind(h);

/* Slow state: a full /state once a second and on anything structural,
   what the user clicked, what the tabs fetched. */
const S = {
  state: signal(null),          /* the last full state from the client */
  profile: signal(null),        /* /profile: name and points */
  version: signal(''),
  tab: signal('live'),
  gameId: signal(0),            /* the game open on GAME and BOARDS */
  library: signal(null),
  libraryAt: 0,
  libFilter: signal('all'),
  libConsoles: signal(new Set()),   /* empty = every console */
  libConsolesOpen: signal(false),
  gameSort: signal('author'),
  gameFilter: signal('all'),
  gameCache: {},                /* id -> /game answer */
  gameTick: signal(0),          /* bumped when the cache changes */
  boardsCache: {},
  boardsTick: signal(0),
  openBoards: signal(new Set()),
  liveMeta: signal({ id: 0, byId: null, icon: '' }),  /* medians for the running game */
  toast: signal(null),
  powerOn: signal(0),           /* bumped when the console starts streaming */
  closed: signal(false),
  error: signal(''),
  hidden: signal(loadHidden())  /* game id -> achievement ids kept out of UP NEXT */
};

/* Hidden achievements live in this browser's localStorage under 'hidden'. */
function loadHidden() {
  try { return JSON.parse(localStorage.getItem('hidden') || '{}') || {}; } catch (e) { return {}; }
}

function setHidden(gameId, ids) {
  const h = Object.assign({}, S.hidden.value);
  if (ids.length) h[gameId] = ids; else delete h[gameId];
  S.hidden.value = h;
  try { localStorage.setItem('hidden', JSON.stringify(h)); } catch (e) { /* private window */ }
}

function hideAch(gameId, id) {
  const cur = S.hidden.value[gameId] || [];
  if (!cur.includes(id)) setHidden(gameId, cur.concat(id));
}

function showHidden(gameId) { setHidden(gameId, []); }

/* Fast state: the numbers a delta carries every snapshot, one signal
   each. */
const fast = {
  frames: signal(0), packets: signal(0), gaps: signal(0), dupes: signal(0), torn: signal(0),
  seconds: signal(0), rate: signal(0), loss: signal(0),
  fSince: signal(0), fPolled: signal(-1), fSeen: signal(-1)
};

/* Measured progress per achievement and the value per tracked
   leaderboard: one signal per id, created on first use. */
const liveVals = new Map();
function liveVal(id) {
  if (!liveVals.has(id)) liveVals.set(id, signal({ m: '', p: 0 }));
  return liveVals.get(id);
}
const trackVals = new Map();
function trackVal(id) {
  if (!trackVals.has(id)) trackVals.set(id, signal(''));
  return trackVals.get(id);
}

/* What the page is listening to. The console has LIVE while it
   streams; following takes over when it stops; otherwise idle. */
const mode = computed(() => {
  const s = S.state.value;
  if (!s) return 'idle';
  return s.console.connected ? 'console' : (s.follow || {}).active ? 'follow' : 'idle';
});

/* Snapshots per second, from the frame counter's own movement, and
   the share of packets lost over the last few seconds. */
const rateWin = { frames: 0, at: 0 };
const lossWin = [];
function measure(c) {
  const now = performance.now();
  const frames = c.frames || 0, gaps = c.gaps || 0;

  if (!rateWin.at || frames < rateWin.frames) { rateWin.frames = frames; rateWin.at = now; fast.rate.value = 0; }
  else if (now - rateWin.at >= 1000) {
    fast.rate.value = Math.round((frames - rateWin.frames) * 1000 / (now - rateWin.at));
    rateWin.frames = frames; rateWin.at = now;
  }

  lossWin.push({ at: now, frames, gaps });
  while (lossWin.length && now - lossWin[0].at > 3000) lossWin.shift();
  const a = lossWin[0], b = lossWin[lossWin.length - 1];
  const df = b.frames - a.frames, dg = b.gaps - a.gaps;
  fast.loss.value = df + dg > 0 && dg >= 0 ? Math.min(1, dg / (df + dg)) : 0;
}

function setFast(c) {
  fast.frames.value = c.frames || 0;
  fast.packets.value = c.packets || 0;
  fast.gaps.value = c.gaps || 0;
  fast.dupes.value = c.dupes || 0;
  fast.torn.value = c.torn || 0;
  fast.seconds.value = c.seconds || 0;
  measure(c);
}

function setLive(list, trk) {
  for (const a of list || []) {
    const sig = liveVal(a.id), cur = sig.value;
    const m = a.m != null ? a.m : (a.measured || ''), p = pctClamp(a.p != null ? a.p : a.percent);
    if (cur.m !== m || cur.p !== p) sig.value = { m, p };
  }
  for (const tr of trk || []) {
    const v = tr.v != null ? tr.v : tr.value;
    const sig = trackVal(tr.id);
    if (sig.value !== v) sig.value = v;
  }
}

let lastUnlock = 0, wasConsole = false;

/* Applies a full state: the counters, the live values, the follow
   clocks, the state signal, the power-on trigger and the unlock toast. */
function applyState(s) {
  if (!s.game) s.game = { achievements: [] };
  batch(() => {
    const c = s.console || {};
    const f = s.follow || {};

    if (s.version) S.version.value = s.version;
    setFast(c);
    setLive(s.game.achievements, s.game.tracking);
    if (f.active) {
      fast.fSince.value = f.since || 0;
      fast.fPolled.value = f.polled_ago >= 0 ? f.polled_ago : -1;
      fast.fSeen.value = f.rp_ago >= 0 ? f.rp_ago : -1;
    }
    S.state.value = s;

    /* connected went from false to true. */
    if (c.connected && !wasConsole) S.powerOn.value++;
    wasConsole = !!c.connected;

    const u = s.unlocks && s.unlocks[0];
    if (u && u.id !== lastUnlock && u.ago < 12) {
      lastUnlock = u.id;
      delete S.gameCache[s.game.id];
      S.gameTick.value++;
      /* The library is dropped and fetched again on the next visit. */
      S.library.value = null;
      S.toast.value = { id: u.id, title: u.title, badge: u.badge || '', points: u.points };
      setTimeout(() => { if (S.toast.value && S.toast.value.id === u.id) S.toast.value = null; }, 6000);
    }
  });
  if (s.game.id && S.liveMeta.value.id !== s.game.id) loadLiveMeta(s.game.id);
}

function applyDelta(d) {
  batch(() => {
    if (d.console) setFast(d.console);
    setLive(d.live, d.tracking);
  });
}

/* ==== 03-api.js ==== */
/* ---- The client's endpoints -------------------------------------------- */

async function getJSON(url) {
  return (await fetch(url, { cache: 'no-store' })).json();
}

async function postForm(url, data) {
  const r = await fetch(url, { method: 'POST', body: new URLSearchParams(data) });
  return r.json();
}

async function refreshState() {
  applyState(await getJSON('/state'));
}

/* /events: one full state or one delta per message. The browser
   reconnects on its own; tick() polls /state every 2 s as well. */
function stream() {
  const es = new EventSource('/events');
  es.onmessage = e => {
    try {
      const d = JSON.parse(e.data);
      if (d.delta) applyDelta(d); else applyState(d);
    } catch (err) { /* not JSON: skipped */ }
  };
}

async function tick() {
  try { await refreshState(); } catch (e) { /* keep polling */ }
  setTimeout(tick, 2000);
}

function loadProfile() {
  getJSON('/profile').then(p => { S.profile.value = p; }).catch(() => {});
}

/* Fetches /library unless a copy younger than two minutes is held. */
let libraryLoading = false;
async function loadLibrary() {
  if (libraryLoading) return;
  if (S.library.value && Date.now() - S.libraryAt < 120000) return;
  libraryLoading = true;
  try {
    S.library.value = (await getJSON('/library')).games || [];
    S.libraryAt = Date.now();
  } catch (e) {
    S.library.value = { error: true };
  }
  libraryLoading = false;
}

/* Fetches /game once per id into S.gameCache and bumps gameTick. */
const gameLoading = new Set();
async function loadGame(id) {
  if (!id || S.gameCache[id] || gameLoading.has(id)) return;
  gameLoading.add(id);
  try {
    S.gameCache[id] = await getJSON('/game?id=' + id);
  } catch (e) {
    S.gameCache[id] = { id, error: true, achievements: [] };
  }
  gameLoading.delete(id);
  S.gameTick.value++;
}

async function loadBoards(id) {
  if (!id || S.boardsCache[id]) return;
  S.boardsCache[id] = { loading: true };
  try {
    S.boardsCache[id] = { boards: (await getJSON('/boards?id=' + id)).boards || [] };
  } catch (e) {
    S.boardsCache[id] = { error: true };
  }
  S.boardsTick.value++;
}

/* Fetches /game for the running game and keeps its medians and types
   by id in S.liveMeta. The answer fills S.gameCache too. */
let liveMetaLoading = false;
function loadLiveMeta(id) {
  if (liveMetaLoading || !id) return;
  liveMetaLoading = true;
  getJSON('/game?id=' + id).then(g => {
    const byId = {};
    for (const a of g.achievements || [])
      byId[a.id] = { median: a.median || 0, type: a.type || '' };
    S.gameCache[id] = g;
    S.gameTick.value++;
    S.liveMeta.value = { id, byId, icon: g.icon || '' };
    liveMetaLoading = false;
  }).catch(() => { liveMetaLoading = false; });
}

function openGame(id) {
  S.gameId.value = id;
  S.tab.value = 'game';
}

/* ==== 10-components.js ==== */
/* ---- Shared components ------------------------------------------------- */

/* Section label with a rule after it; `count` is an optional tail. */
function Eyebrow({ children, count }) {
  return html`<h2 class="eyebrow">${children}${count != null && html`<span class="count">${count}</span>`}</h2>`;
}

/* One stat tile. `v` may be a signal: the text then updates in place. */
function Cell({ k, v, cls }) {
  return html`<div class="cell"><div class="k">${k}</div><div class=${'v ' + (cls || '')}>${v}</div></div>`;
}

function Bar({ value, thin }) {
  return html`<div class=${'bar' + (thin ? ' thin' : '')}><i style=${{ width: pctClamp(value) + '%' }} /></div>`;
}

/* Softcore and hardcore progress, one bar each. `labels` adds the
   name and the count beside each bar. */
function Bars({ awarded, hardcore, total, thin, labels }) {
  const row = (cls, label, n) => html`<div class="prog">
    ${labels && html`<span class="k">${label}</span>`}
    <div class=${'bar ' + cls + (thin ? ' thin' : '')}><i style=${{ width: pct(n, total) + '%' }} /></div>
    ${labels && html`<span class="n">${n} / ${total}</span>`}
  </div>`;
  return html`<div class="bars">${row('sc', t('SOFTCORE'), awarded || 0)}${row('hc', t('HARDCORE'), hardcore || 0)}</div>`;
}

/* Measured progress of one achievement, read from its live signal. */
function Mini({ id }) {
  const v = liveVal(id).value;
  return v.p > 0 ? html`<div class="mini"><i style=${{ width: v.p + '%' }} /></div>` : null;
}

function Measured({ id }) {
  const v = liveVal(id).value;
  return v.m ? html`<span class="lead acc">${v.m}</span>` : null;
}

function Chip({ on, onClick, children, n, cls, title }) {
  return html`<span class=${'chip' + (on ? ' on' : '') + (cls ? ' ' + cls : '')} onClick=${onClick} title=${title}>
    ${children}${n != null && html` <span class="n">${n}</span>`}</span>`;
}

function Empty({ children }) { return html`<div class="empty">${children}</div>`; }

/* Achievement row: badge, title, description, a right column of
   lines. `state` picks the look: done, near, na, locked. */
function AchRow({ a, state, big, right, below }) {
  const locked = state !== 'done';
  return html`<div class=${'row ' + state + (big ? ' big' : '')}>
    <img class="badge" src=${badgeUrl(a, locked)} alt="" loading="lazy" />
    <div class="body">
      <div class="t">${a.title}</div>
      <div class="d">${a.description}</div>
      ${below}
    </div>
    <div class="m">${right}</div>
  </div>`;
}

/* Type tag for the right column: missable in amber, the rest muted. */
function TypeTag({ a }) {
  const ty = achType(a);
  if (!ty) return null;
  return html`<span class=${ty === 'missable' ? 'warn' : ''}>${t(ty.replace('_', ' '))}</span>`;
}

/* Points and the tags after them, one line. */
function Pts({ a, extra }) {
  const parts = [html`<span class="gold">${t('{points} pts', { points: a.points })}</span>`];
  const tag = achType(a);
  if (tag) parts.push(html`<${TypeTag} a=${a} />`);
  if (extra) parts.push(...(Array.isArray(extra) ? extra : [extra]));
  return html`<span class="tag">${parts.map((p, i) => html`${i ? ' · ' : ''}${p}`)}</span>`;
}

/* Labelled toggle; `busy` greys it while the client answers. */
function Switch({ on, label, text, busy, onToggle }) {
  return html`<div class=${'switch' + (on ? ' on' : '') + (busy ? ' busy' : '')} onClick=${onToggle}>
    <span class="k">${label}</span>
    <span class="d">${text}</span>
    <span class="tog" />
  </div>`;
}

function Btn({ children, onClick, primary, danger, sm, disabled, type, id }) {
  const cls = 'btn' + (primary ? ' primary' : '') + (danger ? ' danger' : '') + (sm ? ' sm' : '');
  return html`<button class=${cls} onClick=${onClick} disabled=${disabled} type=${type || 'button'} id=${id}>${children}</button>`;
}

/* The disc: the cover turned by a requestAnimationFrame loop. Speed
   follows the snapshot rate; the loss share slows it; each new gap
   knocks the speed down for a moment and lights the hole red. */
function Disc({ src }) {
  const face = useRef();
  const disc = useRef();

  useEffect(() => {
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (still) return undefined;
    let angle = 0, last = performance.now(), raf = 0;
    let gaps = fast.gaps.peek(), kick = 0, stalled = false;

    const loop = now => {
      const dt = Math.min(0.1, (now - last) / 1000);
      last = now;

      const g = fast.gaps.peek();
      if (g > gaps) kick = Math.min(1, kick + 0.6);
      gaps = g;
      kick = Math.max(0, kick - dt * 1.6);

      const rate = fast.rate.peek();
      const base = rate > 0 ? 90 + rate * 3 : 25;
      const speed = base * (1 - 0.75 * fast.loss.peek()) * (1 - 0.92 * kick);
      angle = (angle + speed * dt) % 360;
      if (face.current) face.current.style.transform = 'rotate(' + angle.toFixed(2) + 'deg)';

      const stall = kick > 0.35;
      if (stall !== stalled && disc.current) {
        disc.current.classList.toggle('stall', stall);
        stalled = stall;
      }
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf);
  }, []);

  return html`<div class="disc" ref=${disc}>
    <div class="face" ref=${face}>
      ${src && html`<img src=${src} alt="" />`}
      <div class="iris" /><div class="grooves" />
    </div>
    <div class="sheen" /><div class="rim" /><div class="hole" />
  </div>`;
}

/* The cover of the game on LIVE: a disc while the console streams, a
   still cover with a signal ring while following, plain otherwise. */
function Cover({ src }) {
  const m = mode.value;
  if (m === 'console') return html`<${Disc} src=${src} />`;
  const img = src ? html`<img class="cover" src=${src} alt="" />` : html`<div class="cover" />`;
  if (m === 'follow') return html`<div class="cover-wrap">${img}<div class="ring" /></div>`;
  return img;
}

function Toast() {
  const u = S.toast.value;
  if (!u) return null;
  return html`<div class="toast">
    <img src=${BADGE + u.badge + '.png'} alt="" />
    <div>
      <div class="k">${t('ACHIEVEMENT UNLOCKED')}</div>
      <div class="t">${u.title}</div>
      <div class="p">${t('+{points} pts', { points: u.points })}</div>
    </div>
  </div>`;
}

/* One sweep of light, mounted for 1.3 s when the console connects. */
function PowerOn() {
  const n = S.powerOn.value;
  const [shown, setShown] = useState(0);

  useEffect(() => {
    if (!n) return undefined;
    setShown(n);
    const id = setTimeout(() => setShown(0), 1300);
    return () => clearTimeout(id);
  }, [n]);
  return shown ? html`<div class="poweron" key=${shown} />` : null;
}

/* ==== 20-live.js ==== */
/* ---- LIVE: the console's session, or the account's play elsewhere ------ */

const STATUS = {
  'active':         ['achievement set active, unlocks are tracked', 'ok'],
  'no-hash':        ["image not identified &mdash; run 'RA: check game support' in the game's OPL menu", 'warn'],
  'telemetry-only': ['telemetry only &mdash; no achievement set could be loaded for this image', 'warn'],
  'identifying':    ['loading the achievement set for this image &mdash; a few seconds', 'warn'],
  'stale':          ["console watch list is out of date &mdash; run 'RA: check game support' again", 'warn']
};

/* Frame counter with the rate, or the packet count before the first frame. */
const framesText = computed(() => {
  const fr = fast.frames.value, r = fast.rate.value;
  return fr ? fr.toLocaleString() + (r ? ' · ' + r + '/s' : '')
            : t('{packets} packets', { packets: fast.packets.value.toLocaleString() });
});
const sessionText = computed(() => fast.seconds.value ? hms(fast.seconds.value) : '—');
const fSinceText = computed(() => fast.fSince.value ? hms(fast.fSince.value) : '—');
const fPolledText = computed(() => fast.fPolled.value >= 0 ? agoText(fast.fPolled.value) : '—');

/* FOLLOW MY PLAY: hidden on REMOTE and without a Web API key. Posts
   /follow and fetches the state again. */
function FollowSwitch({ s }) {
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const f = s.follow || {}, li = s.login || {};

  if (REMOTE || !li.webapi) return null;
  const text = err ? err
    : s.console.connected ? t('the console has LIVE while it streams; following takes over when it stops')
    : f.on ? t('LIVE shows the game you are in on any emulator with RetroAchievements, and the unlocks as they land')
           : t('off. Turn it on and LIVE follows your account on any emulator with RetroAchievements');

  const toggle = async () => {
    setBusy(true); setErr('');
    try {
      const r = await postForm('/follow', { on: f.on ? '0' : '1' });
      if (r.ok) await refreshState(); else setErr(r.error || t('failed'));
    } catch (e) { setErr(t('could not reach the client')); }
    setBusy(false);
  };
  return html`<${Switch} on=${!!f.on} label=${t('FOLLOW MY PLAY')} text=${text} busy=${busy} onToggle=${toggle} />`;
}

/* One line per counter in a tile: the string is split on its dots. */
function lines(text) {
  return text.split(' \u00b7 ').map((p, i) => html`${i ? html`<br />` : ''}${p}`);
}

/* The three loss counters; the component redraws when any one moves. */
function Lost() {
  return lines(t('{gaps} skipped \u00b7 {dupes} repeated \u00b7 {torn} torn',
                 { gaps: fast.gaps.value, dupes: fast.dupes.value, torn: fast.torn.value }));
}

/* Sends the console back to the loader menu: the in-game reset, from
   the PC instead of the six-button combo. Local only, like QUIT. */
async function resetConsole() {
  if (!confirm(t('Close the game and return the console to the loader menu?'))) return;
  try {
    const r = await postForm('/reset', {});
    if (r && r.ok === false) alert(t('The console has not been seen yet.'));
  } catch (err) { alert(t('The client did not answer.')); }
}

/* CONSOLE panel: link, serial, counters, watch list, session clock. */
function ConsolePanel({ s }) {
  const c = s.console;
  if (!c.connected && !c.packets) return null;
  if (!c.connected && (s.follow || {}).active) return null;

  const st = STATUS[c.status];
  const w = c.watch || {};
  const watch = w.addresses
    ? lines(t('{addresses} addr &middot; {bytes} B &middot; {parts} parts',
              { addresses: w.addresses, bytes: w.bytes, parts: w.parts }))
    : '—';

  return html`<${Fragment}>
    <${Eyebrow}>${t('CONSOLE')}<//>
    ${st && html`<div class=${'banner ' + st[1]}>${t(st[0])}</div>`}
    <div class="stats">
      <${Cell} k=${t('LINK')} v=${c.connected ? c.ip : html`<span class="mute">${t('lost')}</span>`} />
      <${Cell} k=${t('GAME')} v=${s.game.serial || '—'} />
      <${Cell} k=${t('SNAPSHOTS')} v=${framesText} />
      <${Cell} k=${t('LOST')} v=${html`<${Lost} />`} />
      <${Cell} k=${t('WATCH LIST')} v=${watch} />
      <${Cell} k=${t('SESSION')} v=${sessionText} />
    </div>
    ${s.game.hash && html`<div class="hash">${t('hash {hash}', { hash: s.game.hash })}</div>`}
    ${!REMOTE && c.connected && html`<div class="subsets"><${Btn} danger sm onClick=${resetConsole}>${t('RESET CONSOLE')}<//></div>`}
  <//>`;
}

/* FOLLOWING panel: the rich presence line, the poll, this session's unlocks. */
function FollowPanel({ s }) {
  const f = s.follow;
  if (!f || !f.active) return null;
  const seen = f.online ? html`<span class="ok">${t('playing now')}</span>`
             : f.rp_date ? f.rp_date
             : fast.fSeen.value >= 0 ? agoText(fast.fSeen.value) : '—';
  const session = f.session || [];

  return html`<${Fragment}>
    <${Eyebrow}>${t('FOLLOWING')}<//>
    <div class="banner ok">${f.rp ? f.rp : t('no rich presence line yet')}</div>
    <div class="stats">
      <${Cell} k=${t('PLATFORM')} v=${s.game.console || '—'} />
      <${Cell} k=${t('LAST SEEN')} v=${seen} />
      <${Cell} k=${t('SOURCE')} v=${t('RetroAchievements &middot; every 20 s')} />
      <${Cell} k=${t('POLLED')} v=${fPolledText} />
      <${Cell} k=${t('SESSION')} v=${fSinceText} />
      <${Cell} k=${t('UNLOCKS')} v=${session.length} />
    </div>
    ${f.failures ? html`<div class="note warn">${t('the Web API is not answering; retrying')}</div>` : null}
    ${session.length > 0 && html`<${Eyebrow}>${t('THIS SESSION')}<//>
      ${session.map(u => html`<div class="row done" key=${u.id}>
        <img class="badge" src=${BADGE + u.badge + '.png'} alt="" />
        <div class="body"><div class="t">${u.title}</div>
          <div class="d">${agoText(u.ago)}${u.hardcore ? ' · ' + t('hardcore') : ''}</div></div>
        <div class="m"><span class="lead ok">+${u.points}</span></div>
      </div>`)}`}
  <//>`;
}

/* The game's head: cover, title, progress bar, counts. */
function LiveHead({ s, list, done, ptsDone, ptsAll, icon }) {
  return html`<div class="head">
    <${Cover} src=${icon ? MEDIA + icon : ''} />
    <div class="body">
      <h1>${s.game.title || s.game.serial}</h1>
      <${Bar} value=${pct(done, list.length)} />
      <div class="sub">
        <span>${s.game.checked_only ? t('from an image check, not from a running game') : (s.game.serial || s.game.console || '')}</span>
        <span class="right"><b>${done}</b> / ${list.length} <span class="mute">·</span> <span class="gold">${ptsDone}</span><span class="mute"> / ${t('{points} pts', { points: ptsAll })}</span></span>
      </div>
    </div>
  </div>`;
}

/* ALL ACHIEVEMENTS: one list, or one per subset when there are several. */
function AchievementGroups({ list, subsets, row }) {
  if (!subsets || subsets.length < 2) return list.map(row);
  return subsets.map(sub => {
    const mine = list.filter(a => a.subset === sub.id);
    if (!mine.length) return null;
    const done = mine.filter(a => a.state === 2).length;
    return html`<${Fragment} key=${sub.id}>
      <${Eyebrow} count=${done + ' / ' + mine.length}>${sub.title.toUpperCase()}<//>
      ${mine.map(row)}
    <//>`;
  });
}

/* One row of ALL ACHIEVEMENTS; reads the achievement's live signal for
   the measured value and the progress. */
function LiveRow({ a, missed, hidden }) {
  const isDone = a.state === 2;
  /* state 3 is rc_client's disabled state: 'not on hardware'. */
  const na = a.state === 3;
  const lv = liveVal(a.id).value;
  const near = !isDone && !na && lv.p > 0;
  const state = isDone ? 'done' : na ? 'na' : near ? 'near' : 'locked';
  return html`<${AchRow} a=${a} state=${state}
    below=${!isDone && !na && html`<${Mini} id=${a.id} />`}
    right=${html`<${Fragment}>
      ${isDone ? html`<span class="lead ok">${t('unlocked')}</span>`
        : na ? html`<span class="lead warn">${t('not on hardware')}</span>`
        : lv.m ? html`<span class="lead acc">${lv.m}</span>`
        : html`<span class="lead">${t('locked')}</span>`}
      <${Pts} a=${a} extra=${hidden ? html`<span class="mute">${t('hidden')}</span>`
                               : missed ? html`<span class="warn">${t('possibly skipped')}</span>` : null} />
    <//>`} />`;
}

function LiveTab() {
  const s = S.state.value;
  if (!s) return html`<${Empty}>${t('loading...')}<//>`;

  const list = s.game.achievements || [];
  const f = s.follow || {};

  if (!list.length) {
    return html`<div class="tab">
      <${FollowSwitch} s=${s} /><${ConsolePanel} s=${s} />
      <${Empty}>${s.console.connected
        ? t('console connected, waiting for a game with achievements')
        : f.on && (s.login || {}).webapi
          ? t('following your RetroAchievements activity: start a game on the console, or in any emulator with RetroAchievements on, and it shows up here within half a minute')
          : t('start a game on the console, or browse your library above')}<//>
    </div>`;
  }

  const done = list.filter(a => a.state === 2).length;
  const ptsDone = list.filter(a => a.state === 2).reduce((n, a) => n + (a.points || 0), 0);
  const ptsAll = list.reduce((n, a) => n + (a.points || 0), 0);

  const lm = S.liveMeta.value;
  const meta = lm.id === s.game.id ? lm.byId : null;
  const medOf = a => meta ? ((meta[a.id] || {}).median || 0) : 0;
  const missed = meta ? possiblyMissed(list, medOf) : new Set();
  const position = meta ? Math.max(0, ...list.filter(a => a.state === 2).map(medOf)) : 0;
  const est = meta ? setEstimates(list, medOf) : null;

  /* UP NEXT: the nearest locked achievements by median, drawn big.
     Hidden ones are left out and the next median takes the slot; the
     chip in the label brings them all back. */
  const hidden = new Set(S.hidden.value[s.game.id] || []);
  let ahead = null;
  if (meta) {
    const picked = upNextPick(list.filter(a => !hidden.has(a.id)), medOf);
    const restore = hidden.size > 0
      ? html`<span class="chip sm" onClick=${() => showHidden(s.game.id)}>${t('{n} hidden', { n: hidden.size })} · ${t('SHOW ALL')}</span>`
      : null;
    if (picked.next.length || restore) {
      ahead = html`<${Eyebrow} count=${restore}>${t('UP NEXT &middot; BY MEDIAN UNLOCK TIME')}<//>
        ${picked.next.map(a => html`<${AchRow} key=${a.id} a=${a} state="near" big
          below=${html`<${Mini} id=${a.id} />`}
          right=${html`<${Fragment}>
            <${Measured} id=${a.id} />
            ${a === picked.prog && html`<span class="tag acc">${t('next in progression')}</span>`}
            ${missed.has(a.id) ? html`<span class="tag warn">${t('possibly skipped')}</span>`
              : medOf(a) <= position ? html`<span class="tag warn">${t('usually done by now')}</span>` : null}
            <${Pts} a=${a} extra=${'~' + medianText(medOf(a))} />
            <span class="hide" onClick=${() => hideAch(s.game.id, a.id)} title=${t('hide from UP NEXT')}>✕ ${t('HIDE')}</span>
          <//>`} />`)}`;
    }
  }

  const trackers = (s.game.tracking || []).length
    ? html`<${Eyebrow}>${t('TRACKING NOW')}<//>
        ${s.game.tracking.map(tr => html`<div class="row near" key=${tr.id}>
          <div class="body"><div class="t">${tr.title}</div></div>
          <div class="m"><span class="lead acc">${trackVal(tr.id)}</span></div>
        </div>`)}`
    : null;

  const strip = html`<div class="stats">
    <${Cell} k=${t('ACHIEVEMENTS')} v=${done + ' / ' + list.length} />
    <${Cell} k=${t('POINTS')} v=${html`<span class="gold">${ptsDone}</span> / ${ptsAll}`} />
    <${Cell} k=${t('BEATEN AT')} v=${est && est.beaten ? '~' + medianText(est.beaten) : '—'} />
    <${Cell} k=${t('FULL SET AT')} v=${est && est.full ? '~' + medianText(est.full) : '—'} />
    <${Cell} k=${t('YOUR POSITION')} v=${position ? '~' + medianText(position) : '—'} />
    <${Cell} k=${t('MISSABLES LEFT')} v=${list.filter(a => a.state !== 2 && achType(a) === 'missable').length} />
  </div>`;

  const row = a => html`<${LiveRow} key=${a.id} a=${a} missed=${missed.has(a.id)} hidden=${hidden.has(a.id)} />`;

  const showAll = ahead || trackers || (s.game.subsets || []).length > 1;

  return html`<div class="tab">
    <${FollowSwitch} s=${s} />
    <${FollowPanel} s=${s} />
    <${ConsolePanel} s=${s} />
    <${LiveHead} s=${s} list=${list} done=${done} ptsDone=${ptsDone} ptsAll=${ptsAll}
      icon=${(meta && lm.icon) || s.game.icon || ''} />
    ${strip}
    ${ahead}
    ${trackers}
    ${showAll && html`<${Eyebrow} count=${done + ' / ' + list.length}>${t('ALL ACHIEVEMENTS')}<//>`}
    <${AchievementGroups} list=${list} subsets=${s.game.subsets} row=${row} />
  </div>`;
}

/* ==== 21-library.js ==== */
/* ---- LIBRARY: every game the account touched, from the Web API --------- */

/* HighestAwardKind: mastered and completed are the hardcore and softcore
   full clears; beaten comes in the same two flavours. */
function awardBadge(g) {
  const a = g.award || '';
  if (a === 'mastered') return html`<span class="award gold">${t('MASTERED')}</span>`;
  if (a === 'completed') return html`<span class="award green">${t('COMPLETED · SC')}</span>`;
  if (a === 'beaten-hardcore') return html`<span class="award blue">${t('BEATEN')}</span>`;
  if (a === 'beaten-softcore') return html`<span class="award blue">${t('BEATEN · SC')}</span>`;
  return null;
}

/* A card: the award sits in the corner of the art, the console always
   shows in the foot, two bars for softcore and hardcore. */
function GameCard({ g }) {
  const art = g.icon ? MEDIA + g.icon : '';
  const award = awardBadge(g);
  return html`<div class="card" onClick=${() => openGame(g.id)}>
    <div class="art">
      ${art && html`<div class="blur" style=${{ backgroundImage: 'url(' + art + ')' }} />`}
      ${art && html`<img src=${art} loading="lazy" alt="" onError=${e => e.target.remove()} />`}
      ${award && html`<span class="corner">${award}</span>`}
    </div>
    <div class="meta">
      <div class="name">${g.title}</div>
      <${Bars} awarded=${g.awarded} hardcore=${g.hardcore} total=${g.total} thin />
      <div class="foot">
        <span>${g.awarded} / ${g.total}${g.hardcore > 0
          ? html` <span class="gold">${t('({n} hc)', { n: g.hardcore })}</span>` : ''}</span>
        <span class="right mute">${g.console}</span>
      </div>
    </div>
  </div>`;
}

const LIB_FILTERS = [['all', 'ALL {n}'], ['new', 'NOT STARTED'], ['progress', 'IN PROGRESS'],
                     ['beaten', 'BEATEN'], ['mastered', 'MASTERED']];

function LibraryTab() {
  useEffect(() => { loadLibrary(); }, []);
  const library = S.library.value;

  if (!library) return html`<div class="tab"><${Empty}>${t('loading your library...')}<//></div>`;
  if (library.error) return html`<div class="tab"><${Empty}>${t('could not reach the client')}<//></div>`;

  const filter = S.libFilter.value;
  const consoles = S.libConsoles.value;
  const open = S.libConsolesOpen.value;

  const isMastered = g => g.mastered || (g.total > 0 && g.awarded >= g.total);
  const shown = library.filter(g => {
    const ok =
      filter === 'all' ? true :
      filter === 'new' ? g.awarded === 0 :
      filter === 'progress' ? g.awarded > 0 && g.awarded < g.total && !(g.award || '').startsWith('beaten') :
      filter === 'beaten' ? (g.award || '').startsWith('beaten') :
      isMastered(g);
    return ok && (consoles.size === 0 || consoles.has(g.console));
  });

  /* Console chips: several can be on; an empty set means all. */
  const perConsole = {};
  for (const g of library) perConsole[g.console] = (perConsole[g.console] || 0) + 1;
  const names = Object.keys(perConsole).sort();
  const conLabel = consoles.size === 0 ? t('ALL CONSOLES')
    : t(consoles.size > 1 ? '{n} CONSOLES' : '{n} CONSOLE', { n: consoles.size });
  const toggleConsole = c => {
    const next = new Set(consoles);
    next.has(c) ? next.delete(c) : next.add(c);
    S.libConsoles.value = next;
  };

  return html`<div class="tab">
    <div class="filters">
      ${LIB_FILTERS.map(([k, label]) => html`<${Chip} key=${k} on=${filter === k}
        onClick=${() => { S.libFilter.value = k; }}>${t(label, { n: library.length })}<//>`)}
      <${Chip} on=${consoles.size > 0} onClick=${() => { S.libConsolesOpen.value = !open; }}>
        ${conLabel} ${open ? '▴' : '▾'}<//>
    </div>
    ${open && html`<div class="filters">
      ${names.map(c => html`<${Chip} key=${c} on=${consoles.has(c)} n=${perConsole[c]}
        onClick=${() => toggleConsole(c)}>${c.toUpperCase()}<//>`)}
    </div>`}
    <div class="grid">${shown.map(g => html`<${GameCard} key=${g.id} g=${g} />`)}</div>
    ${!shown.length && html`<${Empty}>${t('nothing matches these filters')}<//>`}
  </div>`;
}

const GAME_FILTERS = [['all', 'ALL'], ['locked', 'LOCKED'], ['unlocked', 'UNLOCKED'],
                      ['missable', 'MISSABLE'], ['progression', 'PROGRESSION'],
                      ['win_condition', 'WIN CONDITION']];
const GAME_SORTS = [['author', 'AUTHOR ORDER'], ['type', 'PROGRESSION PATH'], ['median', 'MEDIAN TIME']];

/* The base game and its subsets as chips, the open one lit. A click
   opens that game id. */
function Family({ g }) {
  if (!(g.subsets || []).length) return null;
  const base = g.base || {};
  return html`<div class="subsets">
    ${base.id > 0 && html`<${Chip} on=${base.id === g.id} onClick=${() => openGame(base.id)}>${t('MAIN SET')}<//>`}
    ${g.subsets.map(sub => html`<${Chip} key=${sub.id} on=${sub.id === g.id} n=${sub.achievements}
      onClick=${() => openGame(sub.id)}>${sub.title.toUpperCase()}<//>`)}
  </div>`;
}

/* "loading..." for the first 12 s, then a note that the client is busy
   and a link that clears the cache entry and fetches again. */
function Loading({ id }) {
  const [slow, setSlow] = useState(false);
  useEffect(() => {
    setSlow(false);
    const tm = setTimeout(() => setSlow(true), 12000);
    return () => clearTimeout(tm);
  }, [id]);
  if (!slow) return html`<${Empty}>${t('loading...')}<//>`;
  return html`<${Empty}>${t('still loading; the client is busy with RetroAchievements')}${' '}
    <a href="#" onClick=${e => { e.preventDefault(); delete S.gameCache[id]; loadGame(id); }}>${t('try again')}</a><//>`;
}

function GameTab() {
  const id = S.gameId.value;
  S.gameTick.value; /* re-render when a fetch lands */
  useEffect(() => { loadGame(id); loadLibrary(); }, [id]);
  /* The award and the hardcore count come from the library entry:
     /game has neither. */
  const lib = (Array.isArray(S.library.value) ? S.library.value : []).find(x => x.id === id);

  if (!id) return html`<div class="tab"><${Empty}>${t('pick a game in the library')}<//></div>`;
  const g = S.gameCache[id];
  if (!g) return html`<div class="tab"><${Loading} id=${id} /></div>`;
  if (g.error) return html`<div class="tab"><${Empty}>${t('could not reach the client')}<//></div>`;

  const sort = S.gameSort.value, filter = S.gameFilter.value;
  const all = g.achievements || [];
  const list = sortAchievements(all.filter(a =>
    filter === 'all' ? true :
    filter === 'locked' ? !a.earned :
    filter === 'unlocked' ? !!a.earned :
    achType(a) === filter), sort);
  const est = setEstimates(all, a => a.median || 0);

  return html`<div class="tab">
    <div class="head">
      ${g.icon ? html`<img class="cover" src=${MEDIA + g.icon} alt="" />` : html`<div class="cover" />`}
      <div class="body">
        <h1>${g.title}${lib && awardBadge(lib) && html` <span class="h1-award">${awardBadge(lib)}</span>`}</h1>
        <div class="note" style=${{ marginBottom: '10px' }}>
          ${g.console} · ${t('{n} achievements', { n: all.length })}
          ${est.full > 0 && html` · <span class="acc">${est.beaten > 0 && t('beaten ~{time}', { time: medianText(est.beaten) }) + ' · '}${t('full set ~{time}', { time: medianText(est.full) })}</span> <span class="mute">${t('by median unlocks')}</span>`}
        </div>
        <${Bars} labels awarded=${g.awarded} hardcore=${lib ? lib.hardcore : 0} total=${g.total} />
        <div class="sub">
          <a href=${'https://retroachievements.org/game/' + g.id} target="_blank" rel="noopener">${t('on retroachievements.org')}</a>
        </div>
      </div>
    </div>
    <${Family} g=${g} />
    <div class="filters">
      ${GAME_FILTERS.map(([k, label]) => html`<${Chip} key=${k} on=${filter === k}
        onClick=${() => { S.gameFilter.value = k; }}>${t(label)}<//>`)}
    </div>
    <div class="filters">
      ${GAME_SORTS.map(([k, label]) => html`<${Chip} key=${k} on=${sort === k}
        onClick=${() => { S.gameSort.value = k; }}>${t(label)}<//>`)}
    </div>
    ${list.map(a => html`<${AchRow} key=${a.id} a=${a} state=${a.earned ? 'done' : 'locked'}
      right=${html`<${Fragment}>
        ${a.earned ? html`<span class="lead ok">${a.earned.slice(0, 10)}</span>`
                   : html`<span class="lead">${t('locked')}</span>`}
        <${Pts} a=${a} extra=${a.median > 0 ? '~' + medianText(a.median) : null} />
      <//>`} />`)}
  </div>`;
}

/* ==== 23-boards.js ==== */
/* ---- BOARDS: leaderboards, with the live trackers on top --------------- */

function BoardsTab() {
  const id = S.gameId.value;
  S.boardsTick.value; /* re-render when a fetch lands */

  if (!id) return html`<div class="tab"><${Empty}>${t('pick a game in the library')}<//></div>`;

}

/* ==== 24-settings.js ==== */
/* ---- SETTINGS: account, Web API key, the network switch ---------------- */

/* The tab re-renders on this key: the login and the network setting,
   not the whole state. */
const settingsKey = computed(() => {
  const s = S.state.value;
  if (!s) return '';
  const li = s.login || {}, lan = s.lan || {};
  return [li.ok, li.user, li.webapi, lan.on, lan.url].join('|');
});

function Msg({ text, good }) {
  return html`<div class=${'msg ' + (good ? 'ok' : 'warn')}>${text}</div>`;
}

function AccountBlock({ li }) {
  const [msg, setMsg] = useState(['', true]);
  const [busy, setBusy] = useState(false);

  const signIn = async e => {
    e.preventDefault();
    const form = e.target;
    setBusy(true); setMsg([t('signing in...'), true]);
    try {
      const r = await postForm('/login', { user: form.user.value.trim(), password: form.password.value });
      if (r.ok) { setMsg(['', true]); await refreshState(); }
      else setMsg([r.error || t('failed'), false]);
    } catch (err) { setMsg([t('could not reach the client'), false]); }
    setBusy(false);
  };
  const signOut = async () => {
    try { await postForm('/logout', {}); } catch (err) { /* gone already */ }
    try { await refreshState(); } catch (err) { /* the poll catches up */ }
  };

  return html`<div class="block">
    <${Eyebrow}>${t('RETROACHIEVEMENTS ACCOUNT')}<//>
    ${li.ok
      ? html`<div>${tv('signed in as {user}', { user: html`<span class="ok">${li.user}</span>` })}</div>
          <div class="note">${t('unlocks from the console are credited to this account')}</div>
          <${Btn} onClick=${signOut}>${t('SIGN OUT')}<//>`
      : html`<div class="note">${t('the account your unlocks are credited to; only a login token is stored')}</div>
          <form onSubmit=${signIn}>
            <label>${t('username')}</label><input class="f" name="user" autocomplete="username" />
            <label>${t('password')}</label><input class="f" name="password" type="password" autocomplete="current-password" />
            <${Btn} type="submit" primary disabled=${busy}>${t('SIGN IN')}<//>
          </form>`}
    <${Msg} text=${msg[0]} good=${msg[1]} />
  </div>`;
}

function KeyBlock({ li }) {
  const [msg, setMsg] = useState(['', true]);
  const [busy, setBusy] = useState(false);

  const save = async e => {
    e.preventDefault();
    const form = e.target;
    setBusy(true); setMsg([t('saving...'), true]);
    try {
      const r = await postForm('/apikey', { key: form.key.value.trim() });
      if (r.ok) {
        form.key.value = '';
        S.library.value = null;
        loadProfile();
        await refreshState();
        setMsg([t('saved'), true]);
      } else setMsg([r.error || t('failed'), false]);
    } catch (err) { setMsg([t('could not reach the client'), false]); }
    setBusy(false);
  };

  return html`<div class="block">
    <${Eyebrow}>${t('WEB API KEY')}<//>
    <div class="note">${tv('a read-only key that fills the library, leaderboards and profile. Get it at {link}, section "Keys", and paste it here.',
      { link: html`<a href="https://retroachievements.org/settings" target="_blank" rel="noopener">retroachievements.org/settings</a>` })}</div>
    <form onSubmit=${save}>
      <label>${t('key')} ${li.webapi && html`<span class="ok">${t('(saved, paste to replace)')}</span>`}</label>
      <input class="f" name="key" autocomplete="off" />
      <${Btn} type="submit" primary disabled=${busy}>${t('SAVE KEY')}<//>
    </form>
    <${Msg} text=${msg[0]} good=${msg[1]} />
  </div>`;
}

function LanBlock({ lan }) {
  const [msg, setMsg] = useState(['', true]);
  const [busy, setBusy] = useState(false);

  const flip = async () => {
    setBusy(true); setMsg([t(lan.on ? 'closing...' : 'opening...'), true]);
    try {
      const r = await postForm('/lan', { on: lan.on ? '0' : '1' });
      if (!r.ok) { setMsg([r.error || t('failed'), false]); setBusy(false); return; }
      /* The listener reopens on the next request. */
      await new Promise(res => setTimeout(res, 700));
      await refreshState();
      setMsg(['', true]);
    } catch (err) { setMsg([t('could not reach the client'), false]); }
    setBusy(false);
  };

  return html`<div class="block">
    <${Eyebrow}>${t('OTHER DEVICES')}<//>
    ${lan.on
      ? html`<div>${t('open to the network')}${lan.url
            ? html`: <a class="ok" href=${lan.url}>${lan.url}</a>`
            : ' ' + t('(no network address found yet)')}</div>
          <div class="note">${t('type that address into a phone or tablet on the same Wi-Fi and add the page to the home screen. Other devices watch; settings and QUIT stay here. On Windows, allow xerabora through the firewall when it asks.')}</div>
          <${Btn} onClick=${flip} disabled=${busy}>${t('CLOSE TO THIS PC')}<//>`
      : html`<div class="note">${t('the page is reachable from this PC only. Open it to the network and any phone, tablet or second PC on the same Wi-Fi can watch this tracker.')}</div>
          <${Btn} onClick=${flip} primary disabled=${busy}>${t('OPEN TO THE NETWORK')}<//>`}
    <${Msg} text=${msg[0]} good=${msg[1]} />
  </div>`;
}

/* ABOUT: the version this client runs, the newest release on GitHub,
   and where to go with a problem. The release list includes
   prereleases, which /releases/latest leaves out. */
const REPO = 'https://github.com/hacan359/xerabora';
const latestRelease = signal(null);
let latestAsked = false;

function askLatest() {
  if (latestAsked) return;
  latestAsked = true;
  fetch('https://api.github.com/repos/hacan359/xerabora/releases?per_page=1')
    .then(r => r.json())
    .then(list => { if (Array.isArray(list) && list[0]) latestRelease.value = list[0]; })
    .catch(() => { latestAsked = false; });
}

function AboutBlock() {
  askLatest();
  const v = S.version.value;
  const rel = latestRelease.value;
  const newer = rel && v && rel.tag_name !== 'v' + v;

  return html`<div class="block">
    <${Eyebrow}>${t('ABOUT')}<//>
    <div>xeRAbora <span class="ok">${v ? 'v' + v : ''}</span></div>
    ${rel && html`<div class="note">${newer
      ? tv('{tag} is out: {link}', { tag: rel.tag_name, link: html`<a class="ok" href=${rel.html_url} target="_blank" rel="noopener">${t('download')}</a>` })
      : t('this is the latest release')}</div>`}
    <div class="note">${t('something does not work? Read the guide first, then open an issue with the debug build\'s logs.')}</div>
    <div class="links">
      <a href=${REPO + '/blob/main/docs/TROUBLESHOOTING.md'} target="_blank" rel="noopener">${t('BEFORE YOU REPORT')}</a>
      <a href=${REPO + '/issues'} target="_blank" rel="noopener">${t('ISSUES')}</a>
      <a href="https://discord.gg/JZVNPF7cS2" target="_blank" rel="noopener">DISCORD</a>
      <a href=${REPO + '/releases'} target="_blank" rel="noopener">${t('RELEASES')}</a>
      <a href="https://hacan359.github.io/xerabora/" target="_blank" rel="noopener">${t('PROJECT PAGE')}</a>
    </div>
    <div class="note">${t('Built on Open PS2 Loader, rcheevos and ps2sdk. The Android app by MrRexD. The PC client is MIT; the OPL fork keeps OPL\'s AFL 3.0.')}</div>
  </div>`;
}

function SettingsTab() {
  settingsKey.value;
  const s = S.state.peek();
  const li = (s && s.login) || { ok: false, user: '', webapi: false };
  const lan = (s && s.lan) || { on: false, url: '' };

  if (REMOTE) {
    return html`<div class="tab"><div class="set">
      <${Eyebrow}>${t('OTHER DEVICES')}<//>
      <div>${tv('this page is open from {host}', { host: html`<span class="ok">${location.host}</span>` })}</div>
      <div class="note">${t('account, Web API key, the network switch and QUIT are changed on the PC that runs xerabora; from here you watch.')}</div>
      ${li.ok && html`<div style=${{ marginTop: '14px' }}>${tv('signed in as {user}', { user: html`<span class="ok">${li.user}</span>` })}</div>`}
      <div style=${{ marginTop: '26px' }}><${AboutBlock} /></div>

        ${LANGS.map(([code, name]) => html`<option key=${code} value=${code} title=${name}>${(code || 'en').split('-')[0].toUpperCase()}</option>`)}
      </select>
      ${!REMOTE && html`<${Btn} danger sm onClick=${quit}>${t('QUIT')}<//>`}
    </div>
  </div></header>`;
}

function Status() {
  const s = S.state.value;
  const c = (s && s.console) || {};
  const f = (s && s.follow) || {};
  const li = (s && s.login) || { ok: true };
  const m = mode.value;
  const text = !s ? t('waiting for the console')
    : c.connected ? t('console live at {ip}', { ip: c.ip })
    : f.active ? t('following {game} via RetroAchievements', { game: s.game.title || '' }) + (f.online ? ' · ' + t('playing now') : '')
    : !li.ok ? html`<span class="warn">${t('not signed in to RetroAchievements &mdash; open SETTINGS to sign in')}</span>`
    : t('waiting for the console');

  return html`<div class="status"><div class="wrap">
    <span class=${'dot' + ((c.connected || f.active) ? ' on' : '')} />
    ${m !== 'idle' && html`<span class="mode">${t(m === 'console' ? 'CONSOLE' : 'FOLLOWING')}</span>`}
    <span class="text">${text}</span>
    <span class="counters">${linkStats}</span>
  </div></div>`;
}

async function quit() {
  if (!confirm(t('Quit xerabora? Console telemetry and unlocks stop.'))) return;
  try { await postForm('/quit', {}); } catch (err) { /* it is going away */ }
  S.closed.value = true;
}

function Footer() {
  const s = S.state.value;
  const connected = !!(s && s.console.connected);
  return html`<footer><div class="wrap">
    <${Chip} on cls="static" title="every unlock is softcore">${t('SOFTCORE')}<//>
    <${Chip} on=${connected} cls="static" title="the gold flash on the TV: lit while a console streams">${t('FLASH')}<//>
    <span class="clock">${clockText}</span>
  </div></footer>`;
}

function App() {
  if (S.closed.value)
    return html`<div class="closed">${t('xerabora is closed. This tab can be closed too.')}</div>`;

  const tab = S.tab.value;
  const err = S.error.value;
  return html`<div class="app">
    <${Header} />
    <${Status} />
    <main class="wrap">
      ${err && html`<div class="err">${'page error: ' + err}</div>`}
      ${tab === 'live' ? html`<${LiveTab} />`
        : tab === 'library' ? html`<${LibraryTab} />`
        : tab === 'game' ? html`<${GameTab} />`
        : tab === 'boards' ? html`<${BoardsTab} />`
        : html`<${SettingsTab} />`}
    </main>
    <${Footer} />
    <${Toast} />
    <${PowerOn} />
  </div>`;
}

/* Uncaught errors go to the error box at the top of main. */
function showError(err) { S.error.value = String(err && err.stack ? err.stack : err); }
window.addEventListener('error', e => showError(e.error || e.message));
window.addEventListener('unhandledrejection', e => showError(e.reason));

/* data-mode on <html>: the accent and the washes follow it in CSS. */
effect(() => { document.documentElement.dataset.mode = mode.value; });

/* #tab=boards opens straight on a tab; #game=5761 opens that game's card. */
{
  const q = new URLSearchParams(location.hash.slice(1) || location.search);
  const want = q.get('tab');
  const game = +q.get('game');

  if (game > 0) S.gameId.value = game;
  S.tab.value = TABS.includes(want) ? want : game > 0 ? 'game' : 'live';
}

render(html`<${App} />`, document.getElementById('app'));
loadProfile();
stream();
tick();

</script>
</body>
</html>
