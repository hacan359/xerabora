<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xeRAbora demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
  :root {
    --bg: #04101c; --bg2: #123a63; --panel: rgba(20,62,100,.42);
    --panel-lit: rgba(20,62,100,.68); --line: #1d4670;
    --text: #cfe6f7; --dim: #5e93bd; --dimmer: #3d6f96;
    --accent: #7fd4ff; --green: #66ffb2; --amber: #ffb84d;
  }
  * { box-sizing: border-box; }
  html, body { max-width: 100%; overflow-x: hidden; }
  body {
    margin: 0; background: radial-gradient(90% 60% at 30% 0%, var(--bg2) 0%, #071627 62%, var(--bg) 100%);
    background-attachment: fixed; color: var(--text);
    font: 21px/1.3 'VT323', 'Courier New', monospace; min-height: 100vh;
  }
  .px { font-family: 'Press Start 2P', monospace; }
  a { color: var(--accent); }

  header { display: flex; align-items: center; gap: 14px; padding: 10px 14px; background: rgba(4,16,28,.75); position: sticky; top: 0; z-index: 5; }
  header .name { font-size: 10px; color: #fff; }
  nav { display: flex; gap: 2px; margin-left: 14px; }
  nav button {
    font-family: 'Press Start 2P', monospace; font-size: 9px; background: none;
    border: 0; color: var(--dim); padding: 9px 11px; cursor: pointer;
  }
  nav button.on { background: var(--accent); color: #04101c; }
  .right { margin-left: auto; }
  .hdr { display: flex; align-items: center; gap: 12px; min-width: 0; white-space: nowrap; }
  select.lang {
    background: none; border: 1px solid var(--line); color: var(--dim); font: inherit;
    font-size: 15px; padding: 1px 4px; cursor: pointer;
  }
  select.lang:hover, select.lang:focus { border-color: var(--accent); color: var(--text); outline: none; }
  button.quit {
    font-family: 'Press Start 2P', monospace; font-size: 8px; background: none; color: #ff6b6b;
    border: 1px solid #ff6b6b; padding: 7px 10px; cursor: pointer; margin-left: 14px;
  }
  button.quit:hover { background: #ff6b6b; color: #04101c; }
  .switch {
    display: flex; align-items: center; gap: 12px; padding: 9px 10px; background: var(--panel);
    margin-bottom: 4px; cursor: pointer; user-select: none;
  }
  .switch .k { font-family: 'Press Start 2P', monospace; font-size: 9px; color: var(--dim); }
  .switch .state { font-family: 'Press Start 2P', monospace; font-size: 9px; padding: 5px 8px; border: 1px solid var(--line); color: var(--dimmer); }
  .switch.on .state { background: var(--green); color: #04101c; border-color: var(--green); }
  .switch .d { color: var(--dim); font-size: 17px; flex: 1; min-width: 0; }
  .switch.busy { opacity: .5; pointer-events: none; }
  .subsets { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 12px; }
  .muted { color: var(--dim); }
  .dimmer { color: var(--dimmer); }

  .link { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--line); background: rgba(10,33,54,.55); }
  .link span { min-width: 0; }
  .bar { max-width: 100%; }
  .dot { width: 8px; height: 8px; background: var(--dimmer); flex: none; }
  .dot.on { background: var(--green); box-shadow: 0 0 10px var(--green); }

  main { padding: 14px; }
  .head { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 14px; min-width: 0; }
  .head > div { min-width: 0; }
  .head h1, .row .t, .row .d, .link span, .cell .v { overflow-wrap: anywhere; }
  .head img { width: 84px; image-rendering: pixelated; background: #0a2136; border: 1px solid var(--line); flex: none; }
  .head h1 { font-size: 13px; margin: 0 0 10px; color: #fff; line-height: 1.6; }
  .bar { height: 12px; border: 1px solid var(--line); background: #0a2136; position: relative; overflow: hidden; }
  .bar > i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #2f8fd6, var(--accent)); display: block; transition: width .25s; }

  .row { display: flex; align-items: center; gap: 12px; padding: 9px 10px; background: var(--panel); margin-bottom: 4px; }
  .row.done { background: var(--panel-lit); border-left: 2px solid var(--green); }
  .row.near { border-left: 2px solid var(--accent); }
  .row.na { border-left: 2px solid #7a5e26; background: rgba(122,94,38,.12); }
  .row img { width: 34px; height: 34px; image-rendering: pixelated; background: #0a2136; flex: none; }
  .row .body { flex: 1; min-width: 0; }
  .row .t { color: #fff; }
  .row .d { color: var(--dim); font-size: 19px; }
  .row .m { width: 130px; flex: none; text-align: right; }
  .mini { height: 6px; background: #0a2136; position: relative; margin-top: 5px; overflow: hidden; }
  .mini > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); display: block; transition: width .25s; }

  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 4px; margin-bottom: 14px; }
  .stats .cell { background: var(--panel); padding: 7px 10px; min-width: 0; }
  .stats .cell .k { font-size: 15px; color: var(--dimmer); }
  .stats .cell .v { color: #fff; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
  .card { border: 1px solid var(--line); background: rgba(10,33,54,.5); cursor: pointer; }
  .card:hover { border-color: var(--accent); }
  .card .art { height: 104px; background: #0a2136; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--line); }
  .card .art img { max-height: 104px; image-rendering: pixelated; }
  .card .meta { padding: 9px; }
  .card .name { color: #fff; margin-bottom: 7px; height: 2.4em; overflow: hidden; }
  .filters { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); color: var(--dim); padding: 3px 10px; font-size: 16px; cursor: pointer; }
  .chip.on { border-color: var(--accent); color: var(--accent); }

  .row.big { padding: 13px 12px; }
  .row.big img { width: 52px; height: 52px; }
  .row.big .t { font-size: 27px; }
  .row.big .d { font-size: 21px; }
  .row.big .m { width: 170px; }
  .row.clickable { cursor: pointer; }
  .award { font-size: 14px; padding: 1px 6px; border: 1px solid; }
  .award.gold { color: var(--amber); border-color: var(--amber); }
  .award.green { color: var(--green); border-color: var(--green); }
  .award.blue { color: var(--accent); border-color: var(--accent); }

  h2 { font-size: 9px; color: var(--dim); margin: 18px 0 10px; font-weight: normal; }

  .set { max-width: 480px; }
  .set label { display: block; color: var(--dim); font-size: 16px; margin: 10px 0 4px; }
  .set .note { color: var(--dim); font-size: 17px; margin: 6px 0 0; }
  .set .msg { font-size: 17px; margin-top: 8px; min-height: 1.3em; }
  input.f, select.f { background: #0a2136; border: 1px solid var(--line); color: var(--text); font: inherit; padding: 6px 9px; width: 100%; box-sizing: border-box; }
  input.f:focus, select.f:focus { border-color: var(--accent); outline: none; }
  button.act { font-family: 'Press Start 2P', monospace; font-size: 9px; background: var(--accent); color: #04101c; border: 0; padding: 10px 14px; cursor: pointer; margin-top: 12px; }
  button.act:disabled { background: var(--dimmer); cursor: default; }
  footer { padding: 12px 14px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }

  #toast {
    position: fixed; right: 16px; bottom: 16px; display: none; align-items: center; gap: 14px;
    background: linear-gradient(160deg, rgba(47,143,214,.95), rgba(12,45,76,.96));
    border: 2px solid var(--accent); padding: 14px 16px; box-shadow: 0 0 40px rgba(127,212,255,.35);
    animation: in .25s ease-out; z-index: 10;
  }
  #toast img { width: 48px; height: 48px; image-rendering: pixelated; }
  @keyframes in { from { transform: translateY(16px); opacity: 0 } to { transform: none; opacity: 1 } }

  /* Phones: the tabs move to a bar along the bottom, the library gets two
     covers a row, and the fixed-width columns give way. */
  @media (max-width: 600px) {
    header { gap: 10px; padding: 10px 12px; }
    #who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }
    select.lang { font-size: 13px; padding: 0 2px; }
    nav {
      position: fixed; left: 0; right: 0; bottom: 0; margin: 0; z-index: 6;
      background: rgba(4,16,28,.97); border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom);
    }
    nav button { flex: 1; padding: 14px 0 12px; font-size: 8px; }
    main { padding: 12px 12px 90px; }
    footer { display: none; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .card .art, .card .art img { height: 92px; max-height: 92px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .row { gap: 10px; padding: 8px; }
    .row .m { width: 92px; }
    .row.big .m { width: 104px; }
    .row.big .t { font-size: 22px; }
    .row.big .d { font-size: 18px; }
    .head img { width: 64px; }
    .head h1 { font-size: 11px; }
    #linkstats { display: none; }
    #toast { left: 12px; right: 12px; bottom: 76px; }
  }
</style>

  <span class="px name">xe<span style="color:var(--accent)">R</span><span style="color:#ffcc33">A</span>bora</span>

</footer>

{

function t(s, v) {
  const d = LANG[lang];
  let out = (d && d[s]) || s;

  if (v) for (const k in v) out = out.split('{' + k + '}').join(v[k]);

/* A failure in a render lands on the page, not in a console nobody has
   open: an alpha that says "loading..." forever is worse than one that
   names its error. */
function showError(err) {
  const main = document.querySelector('main');
  const box = document.getElementById('err') || main.insertBefore(document.createElement('div'), main.firstChild);

  box.id = 'err';
  box.style.cssText = 'color:#ff6b6b;font-size:17px;padding:8px 0 12px;white-space:pre-wrap';
  box.textContent = 'page error: ' + (err && err.stack ? err.stack : err);
}
window.addEventListener('error', e => showError(e.error || e.message));
window.addEventListener('unhandledrejection', e => showError(e.reason));

/* The static half of the page: header, footer, the toast. */
function translateMarkup() {
  for (const el of document.querySelectorAll('[data-t]'))
    el.textContent = t(el.getAttribute('data-t'));
}

/* The choice belongs to the browser looking at the page, not to the
   client: a phone can read in Spanish while the PC stays English. The
   select in the header shows the short code; the menu has the names. */
function bindLangPicker() {
  const el = document.getElementById('lang-pick');

  el.innerHTML = LANGS.map(([code, name]) =>
    '<option value="' + code + '"' + (code === lang ? ' selected' : '') + ' title="' + name + '">' +
    (code || 'en').split('-')[0].toUpperCase() + '</option>').join('');
  el.onchange = () => {
    try { localStorage.setItem('lang', el.value); } catch (e) { /* private window */ }
    location.reload();
  };
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function hms(s) {
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h + ':' + String(m).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

function pct(a, b) { return b ? Math.round(a * 100 / b) : 0; }

/* ---- CONSOLE: what the terminal log always said, on the page ------------ */

/* Snapshots per second, from the frame counter's own movement. */
let rate = { frames: 0, at: 0, v: 0 };
function snapRate(frames) {
  const now = performance.now();
  if (!rate.at || frames < rate.frames) { rate.frames = frames; rate.at = now; rate.v = 0; }
  else if (now - rate.at >= 1000) {
    rate.v = Math.round((frames - rate.frames) * 1000 / (now - rate.at));
    rate.frames = frames; rate.at = now;
  }
  return rate.v;
}

function framesText(c) {
  const r = snapRate(c.frames || 0);
  return c.frames ? c.frames.toLocaleString() + (r ? ' · ' + r + '/s' : '')
                  : t('{packets} packets', { packets: (c.packets || 0).toLocaleString() });
}

/* Three counters in a 170px tile in a pixel font: one per line, or the
   tail is clipped ("670 rep" was all that showed of the middle one). */
function lostText(c) {
  return t('{gaps} skipped · {dupes} repeated · {torn} torn',
           { gaps: c.gaps || 0, dupes: c.dupes || 0, torn: c.torn || 0 }).split(' · ').join('<br>');
}

/* One stat tile; the CONSOLE, FOLLOWING and LIVE strips all use it. */
const cell = (k, v, id) => '<div class="cell"><div class="k">' + k + '</div><div class="v"' +
                           (id ? ' id="' + id + '"' : '') + '>' + v + '</div></div>';
const muted = text => '<div class="muted">' + text + '</div>';

/* Time cost of a set from its medians: beaten is the latest median on
   the intended path, full the latest of all. */
function setEstimates(list, medOf, isProgression) {
  const meds = list.map(medOf).filter(m => m > 0);
  const path = list.filter(a => isProgression(a)).map(medOf).filter(m => m > 0);

  return { full: meds.length ? Math.max(...meds) : 0,
           beaten: path.length ? Math.max(...path) : 0 };
}

const STATUS = {
  'active':         ['achievement set active, unlocks are tracked', 1],
  'no-hash':        ["image not identified &mdash; run 'RA: check game support' in the game's OPL menu", 0],
  'telemetry-only': ['telemetry only &mdash; no achievement set could be loaded for this image', 0],
  'stale':          ["console watch list is out of date &mdash; run 'RA: check game support' again", 0]
};

/* The em dash is markup in these, so the dictionary key carries it too. */

function consolePanel(s) {
  const c = s.console;
  if (!c.connected && !c.packets) return '';
  /* The console is gone and the account's play elsewhere has LIVE:
     the panel steps aside, the session clock stopped at the loss. */
  if (!c.connected && (s.follow || {}).active) return '';

  const st = STATUS[c.status];
  const w = c.watch || {};

  return '<h2>' + t('CONSOLE') + '</h2>' +
    (st ? '<div class="row ' + (st[1] ? 'done' : 'na') + '"><div class="body"><div class="t">' +
          t(st[0]) + '</div></div></div>' : '') +
    '<div class="stats">' +
    cell(t('LINK'), c.connected ? esc(c.ip) : '<span class="dimmer">' + t('lost') + '</span>') +
    cell(t('GAME'), esc(s.game.serial) || '&mdash;') +
    cell(t('SNAPSHOTS'), '<span id="cv-frames">' + framesText(c) + '</span>') +
    cell(t('LOST'), '<span id="cv-lost">' + lostText(c) + '</span>') +
    cell(t('WATCH LIST'), w.addresses
        ? t('{addresses} addr &middot; {bytes} B &middot; {parts} parts',
            { addresses: w.addresses, bytes: w.bytes, parts: w.parts }).split(' &middot; ').join('<br>')
        : '&mdash;') +
    cell(t('SESSION'), '<span id="cv-session">' + (c.seconds ? hms(c.seconds) : '&mdash;') + '</span>') +
    '</div>' +
    (s.game.hash ? '<div class="dimmer" style="font-size:16px;margin:-8px 0 14px">' +
                   t('hash {hash}', { hash: esc(s.game.hash) }) + '</div>' : '');
}

/* FOLLOWING: the account's play on another device, as the Web API
   sees it. No measured progress and no trackers here; the unlocks,
   UP NEXT and the missable warnings work the same. */
function followPanel(s) {
  const f = s.follow;
  if (!f || !f.active) return '';
  const seen = f.online ? '<span style="color:var(--green)">' + t('playing now') + '</span>'
             : f.rp_date ? esc(f.rp_date) : f.rp_ago >= 0 ? agoText(f.rp_ago) : '&mdash;';
  const session = (f.session || []).length
    ? '<h2>' + t('THIS SESSION') + '</h2>' + f.session.map(u =>
        '<div class="row done"><img src="' + BADGE + u.badge + '.png" alt="">' +
        '<div class="body"><div class="t">' + esc(u.title) + '</div>' +
        '<div class="d">' + agoText(u.ago) +
        (u.hardcore ? ' &middot; ' + t('hardcore') : '') + '</div></div>' +
        '<div class="m"><span style="color:var(--green)">+' + u.points + '</span></div></div>').join('')
    : '';
  return '<h2>' + t('FOLLOWING') + '</h2>' +
    '<div class="row done"><div class="body"><div class="t">' +
    (f.rp ? esc(f.rp) : t('no rich presence line yet')) + '</div></div></div>' +
    '<div class="stats">' +
    cell(t('PLATFORM'), esc(s.game.console || '&mdash;')) +
    cell(t('LAST SEEN'), '<span id="fv-seen">' + seen + '</span>') +
    cell(t('SOURCE'), t('RetroAchievements &middot; every 20 s')) +
    cell(t('POLLED'), '<span id="fv-polled">' +
        (f.polled_ago >= 0 ? agoText(f.polled_ago) : '&mdash;') + '</span>') +
    cell(t('SESSION'), '<span id="fv-session">' + (f.since ? hms(f.since) : '&mdash;') + '</span>') +
    cell(t('UNLOCKS'), (f.session || []).length) +
    '</div>' +
    (f.failures ? '<div class="note" style="color:var(--amber)">' +
                  t('the Web API is not answering; retrying') + '</div>' : '') +
    session;
}

function ago(sec) {
  if (sec < 60) return t('{n} s', { n: sec });
  if (sec < 3600) return t('{n} min', { n: Math.floor(sec / 60) });
  return t('{h} h {m} min', { h: Math.floor(sec / 3600), m: Math.floor((sec % 3600) / 60) });
}

/* Word order moves between languages, so the whole line is one string. */
function agoText(sec) { return t('{time} ago', { time: ago(sec) }); }

/* ---- LIVE: the console's own session, straight from rc_client ---------- */

/* Medians for the running game, one fetch per game. The Web API has no
   played-time; the latest median among earned achievements stands in
   for the player's position. */
let liveMeta = { id: 0, byId: null, loading: false };

function loadLiveMeta(id) {
  if (liveMeta.loading || !id) return;
  liveMeta.loading = true;
  fetch('/game?id=' + id).then(r => r.json()).then(g => {
    const byId = {};
    for (const a of g.achievements || [])
      byId[a.id] = { median: a.median || 0, type: a.type || '' };
    liveMeta = { id, byId, icon: g.icon || '', loading: false };
    gameCache[id] = g; /* the GAME tab profits from the same fetch */
    liveSig = '';      /* one re-render, now with the medians in */
    if (tab === 'live' && lastState) renderLive(lastState);
  }).catch(() => { liveMeta.loading = false; });
}

/* The FOLLOW MY PLAY switch lives on LIVE, where its effect shows. It is
   the PC's to flip: from a phone the client answers 403. */
function followSwitch(s) {
  const f = s.follow || {};
  const li = s.login || {};

  if (REMOTE || !li.webapi) return '';
  return '<div class="switch' + (f.on ? ' on' : '') + '" data-follow="' + (f.on ? '0' : '1') + '">' +
    '<span class="k">' + t('FOLLOW MY PLAY') + '</span>' +
    '<span class="d">' + (s.console.connected
      ? t('the console has LIVE while it streams; following takes over when it stops')
      : f.on ? t('LIVE shows the game you are in on any emulator with RetroAchievements, and the unlocks as they land')
             : t('off. Turn it on and LIVE follows your account on any emulator with RetroAchievements')) +
    '</span>' +
    '<span class="state">' + t(f.on ? 'ON' : 'OFF') + '</span></div>';
}

/* ALL ACHIEVEMENTS, in one list or one list per subset when the server
   sent more than the core set. */
function achievementRows(list, subsets, row) {
  if (!subsets || subsets.length < 2)
    return list.map(row).join('');
  return subsets.map(sub => {
    const mine = list.filter(a => a.subset === sub.id);
    if (!mine.length) return '';
    const done = mine.filter(a => a.state === 2).length;
    return '<h2>' + esc(sub.title).toUpperCase() + ' &middot; ' + done + ' / ' + mine.length + '</h2>' +
      mine.map(row).join('');
  }).join('');
}

function renderLive(s) {
  const list = s.game.achievements || [];
  const done = list.filter(a => a.state === 2).length;
  const ptsDone = list.filter(a => a.state === 2).reduce((n, a) => n + (a.points || 0), 0);
  const ptsAll = list.reduce((n, a) => n + (a.points || 0), 0);

  if (!list.length) {
    const f = s.follow || {};
    document.getElementById('tab-live').innerHTML =
      followSwitch(s) + consolePanel(s) +
      muted(s.console.connected
        ? t('console connected, waiting for a game with achievements')
        : f.on && (s.login || {}).webapi
          ? t('following your RetroAchievements activity: start a game on the console, or in any ' +
              'emulator with RetroAchievements on, and it shows up here within half a minute')
          : t('start a game on the console, or browse your library above'));
    return;
  }

  if (s.game.id && liveMeta.id !== s.game.id)
    loadLiveMeta(s.game.id);
  const meta = liveMeta.id === s.game.id ? liveMeta.byId : null;

  /* UP NEXT: locked achievements with medians just past the position,
     drawn big; below them the ones an average player had by now. */
  const medOf = a => meta ? ((meta[a.id] || {}).median || 0) : 0;
  const missed = meta ? possiblyMissed(list, medOf) : new Set();

  let ahead = '';
  if (meta) {
    const med = medOf;
    const position = Math.max(0, ...list.filter(a => a.state === 2).map(med));
    const picked = upNextPick(list, med);
    const next = picked.next;

    const bigRow = a => '<div class="row big near">' +
      '<img src="' + BADGE + a.badge + '_lock.png" alt="">' +
      '<div class="body"><div class="t">' + esc(a.title) + '</div>' +
      '<div class="d">' + esc(a.description) + '</div>' +
      (a.percent > 0 ? '<div class="mini"><i data-live-p="' + a.id + '" style="width:' + pctClamp(a.percent) + '%"></i></div>' : '') +
      '</div><div class="m">' +
      (a.measured ? '<span style="color:var(--accent)" data-live-m="' + a.id + '">' + esc(a.measured) + '</span>' : '') +
      (a === picked.prog ? '<div style="color:var(--accent)">' + t('next in progression') + '</div>' : '') +
      (missed.has(a.id) ? '<div style="color:var(--amber)">' + t('possibly skipped') + '</div>'
       : med(a) <= position ? '<div style="color:var(--amber)">' + t('usually done by now') + '</div>' : '') +
      '<div class="dimmer" style="font-size:16px"><span style="color:var(--amber)">' +
      t('{points} pts', { points: a.points }) + '</span> &middot; ~' +
      medianText(med(a)) + typeTag(a) + '</div></div></div>';

    ahead = next.length
      ? '<h2>' + t('UP NEXT &middot; BY MEDIAN UNLOCK TIME') + '</h2>' + next.map(bigRow).join('') : '';
  }

  const trackers = (s.game.tracking || []).length
    ? '<h2>' + t('TRACKING NOW') + '</h2>' + s.game.tracking.map(tr =>
        '<div class="row near"><div class="body"><div class="t">' + esc(tr.title) + '</div></div>' +
        '<div class="m px" style="font-size:14px;color:var(--accent)" data-tr="' + tr.id + '">' +
        esc(tr.value) + '</div></div>'
      ).join('')
    : '';

  /* The numbers strip: points, the time the set costs by its medians,
     and where the player stands in it. */
  const est = meta ? setEstimates(list, medOf, a => achType(a) === 'progression' || achType(a) === 'win_condition') : null;
  const position = meta ? Math.max(0, ...list.filter(a => a.state === 2).map(medOf)) : 0;
  const strip = '<div class="stats">' +
    cell(t('ACHIEVEMENTS'), done + ' / ' + list.length) +
    cell(t('POINTS'), '<span style="color:var(--amber)">' + ptsDone + '</span> / ' + ptsAll) +
    cell(t('BEATEN AT'), est && est.beaten ? '~' + medianText(est.beaten) : '&mdash;') +
    cell(t('FULL SET AT'), est && est.full ? '~' + medianText(est.full) : '&mdash;') +
    cell(t('YOUR POSITION'), position ? '~' + medianText(position) : '&mdash;') +
    cell(t('MISSABLES LEFT'), list.filter(a => a.state !== 2 && achType(a) === 'missable').length) +
    '</div>';

  document.getElementById('tab-live').innerHTML =
    followSwitch(s) + followPanel(s) + consolePanel(s) +
    '<div class="head">' +
    (meta && liveMeta.icon ? '<img src="' + MEDIA + liveMeta.icon + '" alt="">'
     : s.game.icon ? '<img src="' + MEDIA + s.game.icon + '" alt="">' : '') +
    '<div style="flex:1">' +
    '<h1>' + esc(s.game.title || s.game.serial) + '</h1>' +
    '<div class="bar"><i style="width:' + pct(done, list.length) + '%"></i></div>' +
    '<div style="display:flex;margin-top:8px;gap:10px;flex-wrap:wrap"><span class="muted">' + esc(s.game.serial || s.game.console || '') + '</span>' +
    '<span class="right">' + done + ' / ' + list.length +
    ' <span class="dimmer">&middot;</span> <span style="color:var(--amber)">' + ptsDone + '</span>' +
    '<span class="dimmer"> / ' + t('{points} pts', { points: ptsAll }) + '</span></span></div></div></div>' +
    strip +
    ahead + trackers +
    ((ahead || trackers || (s.game.subsets || []).length > 1) ? '<h2>' + t('ALL ACHIEVEMENTS') + '</h2>' : '') +
    achievementRows(list, s.game.subsets, a => {
      const isDone = a.state === 2;
      const near = !isDone && a.percent > 0;
      /* state 3 means rc_client disabled it: on hardware that is a
         pointer read the console cannot follow. */
      const na = a.state === 3;
      return '<div class="row' + (isDone ? ' done' : na ? ' na' : near ? ' near' : '') + '">' +
        '<img src="' + BADGE + a.badge + (isDone ? '' : '_lock') + '.png" alt="">' +
        '<div class="body"><div class="t">' + esc(a.title) + '</div>' +
        '<div class="d">' + esc(a.description) + '</div>' +
        (near ? '<div class="mini"><i data-live-p="' + a.id + '" style="width:' + pctClamp(a.percent) + '%"></i></div>' : '') +
        '</div><div class="m">' +
        (isDone ? '<span style="color:var(--green)">' + t('unlocked') + '</span>'
         : na ? '<span style="color:var(--amber)">' + t('not on hardware') + '</span>'
         : a.measured ? '<span style="color:var(--accent)" data-live-m="' + a.id + '">' + esc(a.measured) + '</span>'
         : '<span class="dimmer">' + t('locked') + '</span>') +
        '<div class="dimmer" style="font-size:16px">' +
        t('{points} pts', { points: a.points }) + typeTag(a) +
        (missed.has(a.id) ? ' &middot; <span style="color:var(--amber)">' +
                            t('possibly skipped') + '</span>' : '') +
        '</div></div></div>';
    });
}

/* ---- LIBRARY: every system, from the Web API --------------------------- */

let libConsoles = new Set(); /* empty = every console */
let libConsolesOpen = false;

/* HighestAwardKind: mastered/completed are the hardcore and softcore
   full clears, beaten comes in the same two flavours. */
function awardBadge(g) {
  const a = g.award || '';
  if (a === 'mastered') return '<span class="award gold">' + t('MASTERED') + '</span>';
  if (a === 'completed') return '<span class="award green">' + t('COMPLETED · SC') + '</span>';
  if (a === 'beaten-hardcore') return '<span class="award blue">' + t('BEATEN') + '</span>';
  if (a === 'beaten-softcore') return '<span class="award blue">' + t('BEATEN · SC') + '</span>';
  return '';
}

async function renderLibrary() {
  const el = document.getElementById('tab-library');

  /* Two minutes, the same as the client's own cache of the Web API. */
  if (!library || Date.now() - libraryAt > 120000) {
    if (!library) el.innerHTML = '<div class="muted">' + t('loading your library...') + '</div>';
    try {
      library = (await (await fetch('/library')).json()).games || [];
      libraryAt = Date.now();
    } catch (e) {
      el.innerHTML = '<div class="muted">' + t('could not reach the client') + '</div>';
      return;
    }
  }

  const isMastered = g => g.mastered || (g.total > 0 && g.awarded >= g.total);
  const shown = library.filter(g => {
    const okStatus =
      libFilter === 'all' ? true :
      libFilter === 'new' ? g.awarded === 0 :
      libFilter === 'progress' ? g.awarded > 0 && g.awarded < g.total && !(g.award || '').startsWith('beaten') :
      libFilter === 'beaten' ? (g.award || '').startsWith('beaten') :
      isMastered(g);
    return okStatus && (libConsoles.size === 0 || libConsoles.has(g.console));
  });

  /* Consoles fold behind one chip; several can be on at once, none
     on means all. */
  const perConsole = {};
  for (const g of library) perConsole[g.console] = (perConsole[g.console] || 0) + 1;
  const consoles = Object.keys(perConsole).sort();
  /* Two strings, not a glued 'S': other languages build the plural
     their own way. */
  const conLabel = libConsoles.size === 0 ? t('ALL CONSOLES')
    : t(libConsoles.size > 1 ? '{n} CONSOLES' : '{n} CONSOLE', { n: libConsoles.size });

  el.innerHTML =
    '<div class="filters">' +
    [['all', t('ALL {n}', { n: library.length })], ['new', t('NOT STARTED')],
     ['progress', t('IN PROGRESS')], ['beaten', t('BEATEN')], ['mastered', t('MASTERED')]]
      .map(([k, label]) => '<span class="chip' + (libFilter === k ? ' on' : '') +
                           '" data-filter="' + k + '">' + label + '</span>').join('') +
    '<span class="chip' + (libConsoles.size ? ' on' : '') + '" data-consoles-toggle="1">' +
    conLabel + ' ' + (libConsolesOpen ? '&#9652;' : '&#9662;') + '</span>' +
    '</div>' +
    (libConsolesOpen
      ? '<div class="filters">' +
        consoles.map(c => '<span class="chip' + (libConsoles.has(c) ? ' on' : '') +
                          '" data-console="' + esc(c) + '">' + esc(c).toUpperCase() +
                          ' <span class="dimmer">' + perConsole[c] + '</span></span>').join('') +
        '</div>'
      : '') +
    '<div class="grid">' +
    shown.map(g =>
      '<div class="card" data-game="' + g.id + '">' +
      '<div class="art">' +
      (g.icon ? '<img src="' + MEDIA + esc(g.icon) + '" loading="lazy" onerror="this.remove()" alt="">' : '') +
      '</div>' +
      '<div class="meta"><div class="name">' + esc(g.title) + '</div>' +
      '<div class="bar" style="height:8px"><i style="width:' + pct(g.awarded, g.total) + '%"></i></div>' +
      '<div style="display:flex;margin-top:6px;font-size:16px;align-items:center;gap:6px">' +
      '<span class="muted">' + g.awarded + ' / ' + g.total +
      (g.hardcore > 0 && g.hardcore < g.awarded
        ? ' <span class="dimmer">' + t('({n} hc)', { n: g.hardcore }) + '</span>' : '') +
      '</span>' +
      '<span class="right">' + (awardBadge(g) ||
        '<span class="dimmer">' + esc(g.console) + '</span>') + '</span></div></div></div>').join('') +
    '</div>' +
    (shown.length ? '' : '<div class="muted">' + t('nothing matches these filters') + '</div>');
}

/* ---- GAME: one set in full, from the Web API --------------------------- */

/* The three orders CLIENT.md records: the author's order, the intended
   path (progression, then win condition, missables last), and the
   median unlock time -- the order players take the set in. */
let gameSort = 'author', gameFilter = 'all';

/* Missables sort last: the path reads "do these in order, and mind
   the ones you can lose", per CLIENT.md. Untyped rows sit between. */
const TYPE_RANK = { progression: 0, win_condition: 1, missable: 3 };

/* The Web API hands type as a string, the live state as rc_client's
   number; both normalize to the lowercase string or ''. */
const TYPE_NAMES = ['', 'missable', 'progression', 'win_condition'];

function achType(a) {
  return typeof a.type === 'number' ? (TYPE_NAMES[a.type] || '')
                                    : (a.type || '').toLowerCase();
}

/* UP NEXT picker: the nearest locked achievements by median time, but
   the next progression/win achievement always holds a slot - optional
   unlocks running ahead of the story must not push it off the list. */
function upNextPick(list, med) {
  const byMed = (x, y) => med(x) - med(y);
  const locked = list.filter(a => a.state === 1 && med(a) > 0);
  const spine = locked.filter(a =>
    achType(a) === 'progression' || achType(a) === 'win_condition').sort(byMed);
  const next = locked.sort(byMed).slice(0, 4);

  if (spine.length && !next.includes(spine[0])) {
    next[next.length - 1] = spine[0];
    next.sort(byMed);
  }
  return { next, prog: spine.length ? spine[0] : null };
}

/* A locked missable whose median sits before a story point the player
   has already cleared was probably lost on the way. */
function possiblyMissed(list, med) {
  const passed = Math.max(0, ...list.filter(a => a.state === 2 &&
    (achType(a) === 'progression' || achType(a) === 'win_condition')).map(med));
  const out = new Set();

  for (const a of list)
    if (a.state === 1 && achType(a) === 'missable' && med(a) > 0 && med(a) <= passed)
      out.add(a.id);
  return out;
}

function typeTag(a) {
  const ty = achType(a);
  return ty ? ' &middot; <span' + (ty === 'missable' ? ' style="color:var(--amber)"' : '') +
              '>' + t(ty.replace('_', ' ')) + '</span>'
            : '';
}

function medianText(s) {
  return Math.floor(s / 3600) + 'h' + String(Math.floor(s % 3600 / 60)).padStart(2, '0');
}

function sortAchievements(list) {
  const byAuthor = (a, b) => a.order - b.order;

  if (gameSort === 'median')
    /* Never-unlocked-by-anyone (median 0) goes to the end. */
    return list.sort((a, b) =>
      (a.median > 0 ? a.median : Infinity) - (b.median > 0 ? b.median : Infinity) || byAuthor(a, b));
  if (gameSort === 'type')
    return list.sort((a, b) =>
      (TYPE_RANK[achType(a)] ?? 2) - (TYPE_RANK[achType(b)] ?? 2) || byAuthor(a, b));
  return list.sort(byAuthor);
}

async function renderGame() {
  const el = document.getElementById('tab-game');

  if (!gameId) {
    el.innerHTML = '<div class="muted">' + t('pick a game in the library') + '</div>';
    return;
  }

  if (!gameCache[gameId]) {
    const want = gameId;

    el.innerHTML = muted(t('loading...'));
    /* The client answers one request at a time and a Web API poll can
       hold it for a while; a card opened in the first second after start
       has been seen to wait on that. Say so, and offer another try. */
    const slow = setTimeout(() => {
      el.innerHTML = muted(t('still loading; the client is busy with RetroAchievements') +
        ' <a href="#" data-game="' + gameId + '">' + t('try again') + '</a>');
    }, 12000);
    try {
      gameCache[want] = await (await fetch('/game?id=' + want)).json();
    } catch (e) {
      clearTimeout(slow);
      if (want === gameId) el.innerHTML = muted(t('could not reach the client'));
      return;
    }
    clearTimeout(slow);
    if (want !== gameId) return; /* the user moved on; the cache keeps the answer */
  }

  const g = gameCache[gameId];
  const list = sortAchievements((g.achievements || []).filter(a =>
    gameFilter === 'all' ? true :
    gameFilter === 'locked' ? !a.earned :
    gameFilter === 'unlocked' ? !!a.earned :
    achType(a) === gameFilter));

  const chips = (pairs, cur, attr) => '<div class="filters">' +
    pairs.map(([k, label]) => '<span class="chip' + (cur === k ? ' on' : '') +
                              '" ' + attr + '="' + k + '">' + t(label) + '</span>').join('') + '</div>';

  /* Time cost of the set: beaten = latest median on the intended
     path, full = latest median of all. */
  const est = setEstimates(g.achievements || [], a => a.median || 0,
                           a => achType(a) === 'progression' || achType(a) === 'win_condition');
  const estBeaten = est.beaten, estFull = est.full;

  /* The family strip: the base game and its subsets as chips, the open
     one lit. A subset is another game id, so a click is a plain load. */
  const base = g.base || {};
  const family = (g.subsets || []).length
    ? '<div class="subsets">' +
      (base.id ? '<span class="chip' + (base.id === g.id ? ' on' : '') + '" data-game="' + base.id + '">' +
                 t('MAIN SET') + '</span>' : '') +
      g.subsets.map(sub => '<span class="chip' + (sub.id === g.id ? ' on' : '') + '" data-game="' + sub.id + '">' +
                           esc(sub.title).toUpperCase() + ' <span class="dimmer">' + sub.achievements + '</span></span>').join('') +
      '</div>'
    : '';

  el.innerHTML =
    '<div class="head">' +
    (g.icon ? '<img src="' + MEDIA + g.icon + '" alt="">' : '') +
    '<div style="flex:1"><h1>' + esc(g.title) + '</h1>' +
    '<div class="muted" style="margin-bottom:10px">' + esc(g.console) + ' &middot; ' +
    t('{n} achievements', { n: (g.achievements || []).length }) +
    (estFull ? ' &middot; <span style="color:var(--accent)">' +
               (estBeaten ? t('beaten ~{time}', { time: medianText(estBeaten) }) + ' &middot; ' : '') +
               t('full set ~{time}', { time: medianText(estFull) }) + '</span>' +
               ' <span class="dimmer">' + t('by median unlocks') + '</span>' : '') +
    '</div>' +
    '<div class="bar"><i style="width:' + pct(g.awarded, g.total) + '%"></i></div>' +
    '<div style="display:flex;margin-top:8px"><span class="muted">' +
    '<a href="https://retroachievements.org/game/' + g.id + '" target="_blank">' +
    t('on retroachievements.org') + '</a>' +
    '</span><span class="right">' + g.awarded + ' / ' + g.total + '</span></div></div></div>' +
    family +
    chips([['all', 'ALL'], ['locked', 'LOCKED'], ['unlocked', 'UNLOCKED'],
           ['missable', 'MISSABLE'], ['progression', 'PROGRESSION'],
           ['win_condition', 'WIN CONDITION']], gameFilter, 'data-gfilter') +
    chips([['author', 'AUTHOR ORDER'], ['type', 'PROGRESSION PATH'],
           ['median', 'MEDIAN TIME']], gameSort, 'data-gsort') +
    list.map(a => {
      const done = !!a.earned;
      return '<div class="row' + (done ? ' done' : '') + '">' +
        '<img src="' + BADGE + a.badge + (done ? '' : '_lock') + '.png" alt="">' +
        '<div class="body"><div class="t">' + esc(a.title) + '</div>' +
        '<div class="d">' + esc(a.description) + '</div></div>' +
        '<div class="m">' +
        (done ? '<span style="color:var(--green)">' + esc(a.earned.slice(0, 10)) + '</span>'
              : '<span class="dimmer">' + t('locked') + '</span>') +
        '<div class="dimmer" style="font-size:16px">' + t('{points} pts', { points: a.points }) +
        typeTag(a) +
        (a.median > 0 ? ' &middot; ~' + medianText(a.median) : '') + '</div></div></div>';
    }).join('');
}

/* ---- BOARDS: leaderboards, with the live tracker on top ---------------- */

let boardsCache = {}, tracking = [], openBoards = new Set();

async function renderBoards() {
  const el = document.getElementById('tab-boards');
  const id = gameId || 0;

  if (!id) {
    el.innerHTML = '<div class="muted">' + t('pick a game in the library') + '</div>';
    return;
  }

  if (!boardsCache[id]) {
    el.innerHTML = '<div class="muted">' + t('loading...') + '</div>';
    try {
      boardsCache[id] = (await (await fetch('/boards?id=' + id)).json()).boards || [];
    } catch (e) {
      el.innerHTML = '<div class="muted">' + t('could not reach the client') + '</div>';
      return;
    }
  }

  const boards = boardsCache[id];

  el.innerHTML =
    (tracking.length
      ? '<h2>' + t('TRACKING NOW &middot; FROM CONSOLE MEMORY') + '</h2>' +
        tracking.map(tr =>
          '<div class="row near"><div class="body"><div class="t">' + esc(tr.title) + '</div></div>' +
          '<div class="m px" style="font-size:14px;color:var(--accent)" data-tr="' + tr.id + '">' +
          esc(tr.value) + '</div></div>'
        ).join('')
      : '') +
    '<h2>' + t('{n} LEADERBOARDS &middot; CLICK ONE TO EXPAND', { n: boards.length }) + '</h2>' +
    boards.map(b => {
      /* Closed row: one line, name and record. The click opens the
         description and the record holder. */
      const open = openBoards.has(b.id);
      return '<div class="row clickable' + (open ? ' near' : '') + '" data-board="' + b.id + '">' +
        '<div class="body"><div class="t">' + (open ? '&#9662; ' : '&#9656; ') + esc(b.title) + '</div>' +
        (open ? '<div class="d">' + esc(b.description) + '</div>' : '') +
        '</div><div class="m">' +
        (b.topScore ? '<span style="color:var(--accent)">' + esc(b.topScore) + '</span>' +
                      (open ? '<div class="dimmer" style="font-size:16px">' + esc(b.topUser) + '</div>' : '')
                    : '<span class="dimmer">' + t('no entries') + '</span>') +
        '</div></div>';
    }).join('');
}

/* ---- SETTINGS: both credentials live here, not in a terminal ----------- */

let lastState = null;

async function postForm(url, data) {
  const r = await fetch(url, { method: 'POST', body: new URLSearchParams(data) });
  return r.json();
}

/* Opened from another device: the page shows everything, but the
   settings and the off switch belong to the PC the client runs on. */
const REMOTE = false;

/* Rendered on demand, never from the live stream: a push that redrew
   this tab would wipe whatever is being typed into it. */
function renderSettings() {
  const li = (lastState && lastState.login) || { ok: false, user: '', webapi: false };
  const lan = (lastState && lastState.lan) || { on: false, url: '' };

  if (REMOTE) {
    document.getElementById('tab-settings').innerHTML =
      '<div class="set">' +
      '<h2>' + t('OTHER DEVICES') + '</h2>' +
      '<div>' + t('this page is open from {host}',
                  { host: '<span style="color:var(--green)">' + esc(location.host) + '</span>' }) + '</div>' +
      '<div class="note">' +
      t('account, Web API key, the network switch and QUIT are changed on the PC ' +
        'that runs xerabora; from here you watch.') + '</div>' +
      (li.ok ? '<div style="margin-top:14px">' +
               t('signed in as {user}',
                 { user: '<span style="color:var(--green)">' + esc(li.user) + '</span>' }) + '</div>' : '') +
      '</div>';
    return;
  }

  document.getElementById('tab-settings').innerHTML =
    '<div class="set">' +
    '<h2>' + t('RETROACHIEVEMENTS ACCOUNT') + '</h2>' +
    (li.ok
      ? '<div>' + t('signed in as {user}',
                    { user: '<span style="color:var(--green)">' + esc(li.user) + '</span>' }) + '</div>' +
        '<div class="note">' + t('unlocks from the console are credited to this account') + '</div>' +
        '<button class="act" id="btn-logout">' + t('SIGN OUT') + '</button>'
      : '<div class="note">' +
        t('the account your unlocks are credited to; only a login token is stored') + '</div>' +
        '<form id="form-login">' +
        '<label>' + t('username') + '</label><input class="f" name="user" autocomplete="username">' +
        '<label>' + t('password') + '</label><input class="f" name="password" type="password" autocomplete="current-password">' +
        '<button class="act">' + t('SIGN IN') + '</button></form>') +
    '<div class="msg" id="login-msg"></div>' +

    '<h2 style="margin-top:26px">' + t('WEB API KEY') + '</h2>' +
    '<div class="note">' +
    t('a read-only key that fills the library, leaderboards and profile. ' +
      'Get it at {link}, section "Keys", and paste it here.',
      { link: '<a href="https://retroachievements.org/settings" target="_blank">retroachievements.org/settings</a>' }) +
    '</div>' +
    '<form id="form-apikey">' +
    '<label>' + t('key') + ' ' +
    (li.webapi ? '<span style="color:var(--green)">' + t('(saved, paste to replace)') + '</span>' : '') +
    '</label><input class="f" name="key" autocomplete="off">' +
    '<button class="act">' + t('SAVE KEY') + '</button></form>' +
    '<div class="msg" id="apikey-msg"></div>' +

    '<h2 style="margin-top:26px">' + t('OTHER DEVICES') + '</h2>' +
    (lan.on
      ? '<div>' + t('open to the network') + (lan.url
          ? ': <a href="' + esc(lan.url) + '" style="color:var(--green)">' + esc(lan.url) + '</a>'
          : ' ' + t('(no network address found yet)')) + '</div>' +
        '<div class="note">' +
        t('type that address into a phone or tablet on the same Wi-Fi and add the page ' +
          'to the home screen. Other devices watch; settings and QUIT stay here. ' +
          'On Windows, allow xerabora through the firewall when it asks.') + '</div>' +
        '<button class="act" id="btn-lan">' + t('CLOSE TO THIS PC') + '</button>'
      : '<div class="note">' +
        t('the page is reachable from this PC only. Open it to the network and any ' +
          'phone, tablet or second PC on the same Wi-Fi can watch this tracker.') + '</div>' +
        '<button class="act" id="btn-lan">' + t('OPEN TO THE NETWORK') + '</button>') +
    '<div class="msg" id="lan-msg"></div>' +
    '</div>';

  const msg = (id, text, good) => {
    const el = document.getElementById(id);
    el.textContent = text;
    el.style.color = good ? 'var(--green)' : 'var(--amber)';
  };

  const loginForm = document.getElementById('form-login');
  if (loginForm) loginForm.onsubmit = async e => {
    e.preventDefault();
    const btn = loginForm.querySelector('button');
    btn.disabled = true;
    msg('login-msg', t('signing in...'), true);
    try {
      const r = await postForm('/login', {
        user: loginForm.user.value.trim(), password: loginForm.password.value });
      if (r.ok) {
        lastState = await (await fetch('/state', { cache: 'no-store' })).json();
        renderSettings();
        apply(lastState);
      } else { msg('login-msg', r.error || t('failed'), false); btn.disabled = false; }
    } catch (err) { msg('login-msg', t('could not reach the client'), false); btn.disabled = false; }
  };

  const lanBtn = document.getElementById('btn-lan');
  if (lanBtn) lanBtn.onclick = async () => {
    lanBtn.disabled = true;
    msg('lan-msg', t(lan.on ? 'closing...' : 'opening...'), true);
    try {
      const r = await postForm('/lan', { on: lan.on ? '0' : '1' });
      if (!r.ok) { msg('lan-msg', r.error || t('failed'), false); lanBtn.disabled = false; return; }
      /* The listener reopens on the next request; give it a moment. */
      await new Promise(res => setTimeout(res, 700));
      lastState = await (await fetch('/state', { cache: 'no-store' })).json();
      renderSettings();
    } catch (err) { msg('lan-msg', t('could not reach the client'), false); lanBtn.disabled = false; }
  };

  const logoutBtn = document.getElementById('btn-logout');
  if (logoutBtn) logoutBtn.onclick = async () => {
    try { await postForm('/logout', {}); } catch (err) {}
    if (lastState) lastState.login = { ok: false, user: '', webapi: li.webapi };
    renderSettings();
  };

  const keyForm = document.getElementById('form-apikey');
  keyForm.onsubmit = async e => {
    e.preventDefault();
    const btn = keyForm.querySelector('button');
    btn.disabled = true;
    msg('apikey-msg', t('saving...'), true);
    try {
      const r = await postForm('/apikey', { key: keyForm.key.value.trim() });
      if (r.ok) {
        if (lastState && lastState.login) lastState.login.webapi = true;
        library = null;      /* refetched with the new key */
        loadProfile();
        renderSettings();
        msg('apikey-msg', t('saved'), true);
      } else { msg('apikey-msg', r.error || t('failed'), false); btn.disabled = false; }
    } catch (err) { msg('apikey-msg', t('could not reach the client'), false); btn.disabled = false; }
  };
}

/* ---- Wiring ------------------------------------------------------------ */

function show(name) {
  tab = name;
  for (const t of ['live', 'library', 'game', 'boards', 'settings'])
    document.getElementById('tab-' + t).hidden = t !== name;
  for (const b of document.querySelectorAll('nav button'))
    b.classList.toggle('on', b.dataset.tab === name);
  if (name === 'library') renderLibrary();
  if (name === 'game') renderGame();
  if (name === 'boards') renderBoards();
  if (name === 'settings') renderSettings();
}

/* The red button in the footer. Hidden from other devices: the client
   would answer 403 anyway. */
async function quit() {
  if (!confirm(t('Quit xerabora? Console telemetry and unlocks stop.'))) return;
  try { await postForm('/quit', {}); } catch (err) { /* it is going away */ }
  document.body.innerHTML =
    '<div class="muted" style="padding:60px;text-align:center;font-size:20px">' +
    t('xerabora is closed. This tab can be closed too.') + '</div>';
}

async function setFollow(el, on) {
  el.classList.add('busy');
  try {
    const r = await postForm('/follow', { on });
    if (r.ok) {
      lastState = await (await fetch('/state', { cache: 'no-store' })).json();
      liveSig = '';
      apply(lastState);
      return;
    }
    el.querySelector('.d').textContent = r.error || t('failed');
  } catch (err) {
    el.querySelector('.d').textContent = t('could not reach the client');
  }
  el.classList.remove('busy');
}

document.addEventListener('click', e => {
  const nav = e.target.closest('nav button');
  if (nav) return show(nav.dataset.tab);

  const sw = e.target.closest('[data-follow]');
  if (sw) return setFollow(sw, sw.dataset.follow);

  const chip = e.target.closest('[data-filter]');
  if (chip) { libFilter = chip.dataset.filter; return renderLibrary(); }

  const ct = e.target.closest('[data-consoles-toggle]');
  if (ct) { libConsolesOpen = !libConsolesOpen; return renderLibrary(); }

  const con = e.target.closest('[data-console]');
  if (con) {
    const c = con.dataset.console;
    libConsoles.has(c) ? libConsoles.delete(c) : libConsoles.add(c);
    return renderLibrary();
  }

  const bd = e.target.closest('[data-board]');
  if (bd) {
    const id = +bd.dataset.board;
    openBoards.has(id) ? openBoards.delete(id) : openBoards.add(id);
    return renderBoards();
  }

  const gf = e.target.closest('[data-gfilter]');
  if (gf) { gameFilter = gf.dataset.gfilter; return renderGame(); }

  const gs = e.target.closest('[data-gsort]');
  if (gs) { gameSort = gs.dataset.gsort; return renderGame(); }

  const card = e.target.closest('[data-game]');
  if (card) {
    e.preventDefault();
    gameId = +card.dataset.game;
    if (card.tagName === 'A') delete gameCache[gameId]; /* "try again" */
    return show('game');
  }
});

/* The live feed. The client pushes a state whenever a snapshot lands,
   so the numbers move at the game's rate rather than a poll timer's.
   The browser reconnects on its own if the client restarts; the poll
   below stays as the fallback for whatever is not pushed. */
function stream() {
  const es = new EventSource('/events');
  es.onmessage = e => {
    try {
      const d = JSON.parse(e.data);
      if (d.delta) applyDelta(d); else apply(d);
    } catch (err) {}
  };
}

/* rc_client's measured_percent is already 0..100. */
function pctClamp(v) { return Math.max(0, Math.min(100, +v || 0)); }

function setVals(sel, txt) {
  for (const el of document.querySelectorAll(sel)) el.textContent = txt;
}

/* The numbers that move every frame, poured into the existing layout:
   the DOM stays put, so CSS transitions play instead of being
   torn down sixty times a second. */
function updateLiveNumbers(c, live, trk) {
  if (c) {
    const fr = document.getElementById('cv-frames');
    if (fr) fr.textContent = framesText(c);
    const lo = document.getElementById('cv-lost');
    if (lo) lo.innerHTML = lostText(c);
    const se = document.getElementById('cv-session');
    if (se) se.textContent = c.seconds ? hms(c.seconds) : '-';
    document.getElementById('linkstats').textContent =
      c.frames ? t('{frames} snapshots, {skipped} skipped',
                   { frames: c.frames.toLocaleString(), skipped: c.gaps || 0 })
      : c.packets ? t('{packets} packets', { packets: c.packets.toLocaleString() }) : '';
    document.getElementById('clock').textContent = c.seconds ? hms(c.seconds) : '';
  }
  for (const a of live || []) {
    if (a.m) setVals('[data-live-m="' + a.id + '"]', a.m);
    for (const el of document.querySelectorAll('[data-live-p="' + a.id + '"]'))
      el.style.width = pctClamp(a.p) + '%';
  }
  for (const t of trk || []) setVals('[data-tr="' + t.id + '"]', t.v);
}

function applyDelta(d) {
  updateLiveNumbers(d.console, d.live, d.tracking);
}

/* A full state redraws a tab only when its structure changed: a new
   game, an unlock, a tracker appearing. Otherwise the numbers are
   updated in place, same as a delta. */
let liveSig = '', boardsSig = '', settingsSig = '';

function apply(s) {
    const c = s.console;

    lastState = s;
    if (s.version) document.getElementById('ver').textContent = 'v' + s.version;
    const li = s.login || { ok: true };
    const f = s.follow || {};
    document.getElementById('dot').className = 'dot' + ((c.connected || f.active) ? ' on' : '');
    document.getElementById('chip-flash').classList.toggle('on', !!c.connected);
    document.getElementById('linktext').innerHTML =
      c.connected ? t('console live at {ip}', { ip: esc(c.ip) })
      : f.active ? t('following {game} via RetroAchievements', { game: esc(s.game.title || '') }) +
                   (f.online ? ' &middot; ' + t('playing now') : '')
      : !li.ok ? '<span style="color:var(--amber)">' +
                 t('not signed in to RetroAchievements &mdash; open SETTINGS to sign in') + '</span>'
      : t('waiting for the console');

    tracking = s.game.tracking || [];
    const list = s.game.achievements || [];

    if (tab === 'live') {
      const sig = [s.game.serial, c.connected, c.status || '', s.game.title || '',
                   (c.watch && c.watch.addresses) || 0,
                   list.map(a => a.id + ':' + a.state).join(','),
                   tracking.map(t => t.id).join(','),
                   f.active ? [f.game_id, f.rp, f.online, f.failures, (f.session || []).length].join('|') : ''
                  ].join('|');
      if (sig !== liveSig) { liveSig = sig; renderLive(s); }
    }
    if (tab === 'boards' && tracking.length) {
      const bsig = tracking.map(t => t.id).join(',');
      if (bsig !== boardsSig) { boardsSig = bsig; renderBoards(); }
    }
    /* SETTINGS is drawn from the last state, so a page that opened on
       that tab shows a signed-out form until the first state lands. */
    if (tab === 'settings') {
      const ssig = [li.ok, li.user, li.webapi, (s.lan || {}).on, (s.lan || {}).url,
                    (s.follow || {}).on].join('|');
      if (ssig !== settingsSig) { settingsSig = ssig; renderSettings(); }
    }
    updateLiveNumbers(c,
      list.map(a => ({ id: a.id, m: a.measured, p: a.percent })),
      tracking.map(t => ({ id: t.id, v: t.value })));
    if (f.active) {
      const po = document.getElementById('fv-polled');
      if (po) po.textContent = f.polled_ago >= 0 ? agoText(f.polled_ago) : '\u2014';
      const se = document.getElementById('fv-session');
      if (se) se.textContent = f.since ? hms(f.since) : '\u2014';
      const sn = document.getElementById('fv-seen');
      if (sn && !f.online && !f.rp_date && f.rp_ago >= 0) sn.textContent = agoText(f.rp_ago);
      document.getElementById('clock').textContent = f.since ? hms(f.since) : '';
    }

    const u = s.unlocks && s.unlocks[0];
    if (u && u.id !== lastUnlock && u.ago < 12) {
      lastUnlock = u.id;
      delete gameCache[s.game.id];
      if (tab === 'game' && gameId === s.game.id) renderGame();
      /* The shelf changed too; give the server a moment to record it. */
      library = null;
      if (tab === 'library') setTimeout(renderLibrary, 3000);
      const toastEl = document.getElementById('toast');
      document.getElementById('toastimg').src = BADGE + (u.badge || '') + '.png';
      document.getElementById('toasttext').textContent =
        u.title + '  ' + t('+{points} pts', { points: u.points });
      toastEl.style.display = 'flex';
      setTimeout(() => { toastEl.style.display = 'none'; }, 6000);
    }
}

async function tick() {
  try {
    apply(await (await fetch('/state', { cache: 'no-store' })).json());
  } catch (e) { /* the client went away; keep trying */ }
  setTimeout(tick, 2000);
}

function loadProfile() {
  fetch('/profile').then(r => r.json()).then(p => {
    document.getElementById('who').textContent =
      p.user ? t('{user} · {points} points',
                 { user: p.user, points: p.points.toLocaleString() })
             : t('no Web API key, see SETTINGS');
  }).catch(() => {});
}

translateMarkup();
bindLangPicker();
document.getElementById('btn-quit').hidden = REMOTE;
document.getElementById('btn-quit').onclick = quit;
loadProfile();
/* #tab=boards opens straight on a tab: a deep link, and the tab a demo
   or an OBS window should start on. */
{
  const q = new URLSearchParams(location.hash.slice(1) || location.search);
  const want = q.get('tab');
  const game = +q.get('game');

  /* #game=5761 opens that game's card, a link worth sharing. */
  if (game > 0) { gameId = game; show('game'); }
  else show(['live', 'library', 'game', 'boards', 'settings'].includes(want) ? want : 'live');
}
stream();
tick();
</script>
