name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  opl:
    name: OPL fork (${{ matrix.variant }})
    runs-on: ubuntu-latest
    container: ghcr.io/ps2homebrew/ps2homebrew:main
    strategy:
      matrix:
        include:
          - variant: release
            flags: ""
            elf: OPL-RA.ELF
          - variant: debug
            flags: "RA_DEBUG=1"
            elf: OPL-RA-debug.ELF
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Mark the checkout as safe for git inside the container
        run: git config --global --add safe.directory '*' 

      - name: Build
        working-directory: opl
        run: |
          make PADEMU=0 ${{ matrix.flags }} all
          cp OPNPS2LD.ELF ../${{ matrix.elf }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.elf }}
          path: ${{ matrix.elf }}

  client-linux:
    name: PC client (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install libcurl
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev

      - name: Build
        working-directory: client
        run: make xerabora && ./xerabora --help

      - uses: actions/upload-artifact@v4
        with:
          name: xerabora-linux-x86_64
          path: client/xerabora

  client-windows:
    name: PC client (Windows, MinGW cross build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install MinGW-w64
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64

      - name: Build
        working-directory: client
        run: make xerabora.exe

      - uses: actions/upload-artifact@v4
        with:
          name: xerabora-windows-x86_64
          path: client/xerabora.exe

  client-macos:
    name: PC client (macOS, universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # A failed build puts its last lines on the run's summary page, which
      # needs no sign-in to read; the full log does.
      - name: Build
        working-directory: client
        run: |
          set -o pipefail
          if ! make macos 2>&1 | tee build.log; then
            { echo '### macOS build failed'; echo '```'; tail -80 build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          ./xerabora-macos --help

      # Both slices present, the page server answers, and the browser
      # branch runs for real: what a Linux job cannot check.
      - name: Smoke test
        working-directory: client
        run: |
          set -e
          lipo -archs xerabora-macos
          lipo -archs xerabora-macos | grep -q arm64
          lipo -archs xerabora-macos | grep -q x86_64
          ./xerabora-macos --ui-only --no-sound &
          pid=$!
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18280/ -o page.html && break || sleep 1
          done
          grep -q '<title>xerabora</title>' page.html
          kill $pid

      - uses: actions/upload-artifact@v4
        with:
          name: xerabora-macos
          path: client/xerabora-macos

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [opl, client-linux, client-windows, client-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Arrange assets
        run: |
          set -e
          mkdir out
          cp dist/OPL-RA.ELF/OPL-RA.ELF out/
          cp dist/OPL-RA-debug.ELF/OPL-RA-debug.ELF out/
          cp dist/xerabora-windows-x86_64/xerabora.exe out/
          cp dist/xerabora-linux-x86_64/xerabora out/xerabora-linux-x86_64
          cp dist/xerabora-macos/xerabora-macos out/
          cd out && sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          prerelease: true
