name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  opl:
    name: OPL fork (${{ matrix.variant }})
    runs-on: ubuntu-latest
    container: ghcr.io/ps2homebrew/ps2homebrew:main
    strategy:
      matrix:
        include:
          - variant: release
            flags: ""
            elf: OPL-RA.ELF
          - variant: debug
            flags: "RA_DEBUG=1"
            elf: OPL-RA-debug.ELF
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Mark the checkout as safe for git inside the container
        run: git config --global --add safe.directory '*' 

      - name: Build
        working-directory: opl
        run: |
          make PADEMU=0 ${{ matrix.flags }} all
          cp OPNPS2LD.ELF ../${{ matrix.elf }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.elf }}
          path: ${{ matrix.elf }}

  client-linux:
    name: PC client (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install libcurl
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev

      - name: Build
        working-directory: client
        run: make ps2ra && ./ps2ra --help

      - uses: actions/upload-artifact@v4
        with:
          name: ps2ra-linux-x86_64
          path: client/ps2ra

  client-windows:
    name: PC client (Windows, MinGW cross build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install MinGW-w64
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64

      - name: Build
        working-directory: client
        run: make ps2ra.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ps2ra-windows-x86_64
          path: client/ps2ra.exe

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [opl, client-linux, client-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Arrange assets
        run: |
          set -e
          mkdir out
          cp dist/OPL-RA.ELF/OPL-RA.ELF out/
          cp dist/OPL-RA-debug.ELF/OPL-RA-debug.ELF out/
          cp dist/ps2ra-windows-x86_64/ps2ra.exe out/
          cp dist/ps2ra-linux-x86_64/ps2ra out/ps2ra-linux-x86_64
          cd out && sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          prerelease: true
